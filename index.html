    const files = Array.from(e.target.files||[]); e.target.value='';
    files.forEach(f=>{
      if(f.size > 200*1024){ toast(`${f.name}: 200KB를 넘어 파일명만 기록합니다. 링크로 등록해 주세요.`); d.files.push({id:uid('f'),name:f.name,type:f.type,size:f.size,dataUrl:null}); renderFiles(); autosave(); return; }
      const r = new FileReader(); r.onload = ()=>{ d.files.push({id:uid('f'),name:f.name,type:f.type,size:f.size,dataUrl:r.result}); renderFiles(); autosave(); }; r.readAsDataURL(f);
    });
  }
  function recalc(){
    const b = budgetOf(d);
    $('#cTotal',body).textContent = won(b.total);
    $('#cRoas',body).textContent = b.roas!=null ? b.roas.toFixed(2)+'배' : '-';
    const rem = $('#cRemain',body); rem.textContent = won(b.remain); rem.classList.toggle('neg', b.remain<0);
    const days = daysBetween(d.start,d.end)+1;
    const a = weekIndexOf(d.start), z = weekIndexOf(d.end);
    let wl = '';
    if(a==null||z==null) wl='날짜를 입력하세요';
    else if(z<0 || a>=WEEKS.length) wl='9~12월 범위 밖입니다 (캘린더에 표시되지 않음)';
    else { const A=Math.max(0,a), Z=Math.min(WEEKS.length-1,z); wl = A===Z ? `${WEEKS[A].month}월 ${WEEKS[A].week}주차` : `${WEEKS[A].month}월 ${WEEKS[A].week}주차 ~ ${WEEKS[Z].month}월 ${WEEKS[Z].week}주차 (${Z-A+1}개 주차)`; if(a<0||z>=WEEKS.length) wl += ' · 일부 범위 밖'; }
    $('#cWeek',body).textContent = wl + (days>0?` · 총 ${days}일`:'');
    // 동시 진행 검사 (자신 제외)
    const counts = new Array(WEEKS.length).fill(0);
    S.promotions.forEach(p=>{ if(p.id===d.id||p.archived||p.status==='취소') return; const sp=spanOf(p); if(!sp) return; for(let i=sp.a;i<=sp.b;i++) counts[i]++; });
    const sp = spanOf(d); let maxc=0; if(sp) for(let i=sp.a;i<=sp.b;i++) maxc=Math.max(maxc,counts[i]+1);
    const cc = $('#cConc',body);
    if(maxc>=CONCURRENT_LIMIT){ cc.innerHTML = `<span style="color:var(--danger);font-weight:500">동시 진행 기획전이 최대치(${CONCURRENT_MAX}건)를 넘습니다</span> <span class="note">(해당 기간 최대 ${maxc}건, 전 채널 합산 · 등록은 가능하지만 일정 조정을 권장)</span>`; } else if(maxc>=CONCURRENT_MAX){ cc.innerHTML = `<span style="color:var(--warn);font-weight:500">이 기간은 동시 진행 최대치(${CONCURRENT_MAX}건)에 도달합니다</span> <span class="note">(해당 기간 ${maxc}건, 전 채널 합산)</span>`; }
    else cc.innerHTML = sp ? `<span class="note">해당 기간 동시 진행 최대 ${maxc}건</span>` : '<span class="note">-</span>';
    const qsum = saleLines(d).reduce((s,p)=>s+num(p.qty),0); const gh=$('#giftCostHint',body); if(gh && giftLines(d).length){ const est=giftCostEstimate(); gh.textContent=`추정 사은품 원가 ${won(est)}`; $('#giftCostApply',body).hidden=!est; } $('#qtyHint',body).textContent = qsum ? `(상품별 합계 ${fmt(qsum)})` : '';
    $('#fmSub',ov).textContent = `${(byId(S.channels,d.channelId)||{}).name||''} · ${d.start||''} ~ ${d.end||''}`;
  }
  function validate(){
    const errs=[]; if(!d.name.trim()) errs.push('기획전명을 입력하세요'); if(!d.channelId) errs.push('판매 채널을 선택하세요'); if(!d.start||!d.end) errs.push('시작일과 종료일을 입력하세요'); if(d.start&&d.end&&d.end<d.start) errs.push('종료일이 시작일보다 빠릅니다');
    $('#fmErr',ov).textContent = errs.join(' · '); return !errs.length;
  }
  async function persist(){
    if(!validate()) return false;
    if(!d.id) d.id = uid('pr');
    d.updatedAt = new Date().toISOString(); d.name=d.name.trim();
    await S.store.put('promotions', clone(d)); saved=true; return true;
  }
  const autosave = debounce(async ()=>{ if(!saved) return; if(!validate()) return; await persist(); const a=$('#autosave',ov); if(a){ a.textContent='자동 저장됨 '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}); a.classList.add('on'); } }, 600);
  $('#fmPrompt',ov).addEventListener('click', ()=>openPromptBuilder({draft:d}));
  $('#fmImport',ov).addEventListener('click', ()=>openImportPromo({draft:d, onDraft:(nd)=>{ const keepId=d.id; Object.keys(nd).forEach(k=>{ if(k!=='id'&&k!=='createdAt') d[k]=nd[k]; }); d.id=keepId; render(); autosave(); }}));
  $('#fmSave',ov).addEventListener('click', async ()=>{ if(await persist()){ closeModal(ov); toast(isEdit?'저장했습니다':'기획전을 등록했습니다'); if(opts.onSaved) opts.onSaved(d); } });
  if(isEdit) $('#fmDup',ov).addEventListener('click', async ()=>{ if(!(await persist())) return; closeModal(ov); duplicatePromotion(d); });
  render();
  setTimeout(()=>{ const n=$('[data-k="name"]',body); if(n && !isEdit) n.focus(); }, 30);
  return ov;
}

async function savePromotion(p){ p.updatedAt=new Date().toISOString(); await S.store.put('promotions', clone(p)); }
async function duplicatePromotion(src){
  const c = normalizePromotion(src); c.id = uid('pr'); c.name = src.name+' (복사)'; c.status='아이디어'; c.archived=false; c.createdAt=new Date().toISOString();
  c.checklist = (c.checklist||[]).map(x=>Object.assign({},x,{id:uid('ci'),done:false}));
  await savePromotion(c); toast('카드를 복제했습니다'); openDetail(c.id);
}
async function movePromotion(p, opts){ // opts: {channelId, weekIdx, start, end}
  const n = normalizePromotion(p);
  if(opts.channelId) n.channelId = opts.channelId;
  if(opts.weekIdx!=null){ const dur = Math.max(0, daysBetween(n.start,n.end)); n.start = WEEKS[opts.weekIdx].start; n.end = addDays(n.start, dur); }
  if(opts.start) n.start=opts.start; if(opts.end) n.end=opts.end; if(n.end<n.start) n.end=n.start;
  await savePromotion(n); return n;
}

/* AI로 수정: 현재 내용을 파일로 받아 Claude에 넣고, 고친 파일을 다시 넣어 같은 기획전을 업데이트 */
function openAiEdit(p){

cal.addEventListener('dragstart', e=>{ const card=e.target.closest('.card'); if(!card) return; dragId=card.dataset.id; e.dataTransfer.effectAllowed='move'; try{ e.dataTransfer.setData('text/plain', dragId); }catch(_){} card.classList.add('dragging'); });
cal.addEventListener('dragend', e=>{ const card=e.target.closest('.card'); if(card) card.classList.remove('dragging'); $$('.slot.dragover',cal).forEach(s=>s.classList.remove('dragover')); dragId=null; });
cal.addEventListener('dragover', e=>{ const slot=e.target.closest('.slot'); if(!slot||!dragId) return; e.preventDefault(); e.dataTransfer.dropEffect='move'; if(!slot.classList.contains('dragover')){ $$('.slot.dragover',cal).forEach(s=>s.classList.remove('dragover')); slot.classList.add('dragover'); } });
cal.addEventListener('dragleave', e=>{ const slot=e.target.closest('.slot'); if(slot && !slot.contains(e.relatedTarget)) slot.classList.remove('dragover'); });
cal.addEventListener('drop', async e=>{
  const slot=e.target.closest('.slot'); if(!slot) return; e.preventDefault();
  const id = dragId || e.dataTransfer.getData('text/plain'); const p=S.promotions.find(x=>x.id===id); if(!p) return;
  const wk=Number(slot.dataset.w), ch=slot.dataset.ch; const sp=spanOf(p);
  if(sp && sp.a===wk && p.channelId===ch) return;
  await movePromotion(p, {channelId:ch, weekIdx:wk}); toast(`${p.name} → ${(byId(S.channels,ch)||{}).name} · ${WEEKS[wk].month}월 ${WEEKS[wk].week}주차`);
});
function inlineEditChannel(cell){
  const ch = byId(S.channels, cell.dataset.ch); if(!ch) return; const field = cell.dataset.edit;
  const orig = cell.innerHTML;
  const inp = document.createElement(field==='desc'?'textarea':'input'); inp.className='edit'; inp.value = ch[field]||''; if(field==='name') inp.type='text';
  cell.innerHTML=''; cell.appendChild(inp); inp.focus(); inp.select();
  let done=false;
  const commit = async ()=>{ if(done) return; done=true; const v=inp.value.trim(); if(v!==(ch[field]||'') && (field!=='name'||v)){ ch[field]=v; await S.store.put('channels', ch); toast('채널 정보를 저장했습니다'); } else renderCalendar(); };
  inp.addEventListener('blur', commit);
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter' && (field==='name' || e.ctrlKey || e.metaKey)){ e.preventDefault(); commit(); } if(e.key==='Escape'){ done=true; cell.innerHTML=orig; } });
}

/* ---------------- 설정: 기준 · 목적 · 채널 · 체크리스트 · 데이터 ---------------- */
function usageCount(kind, id){
  if(kind==='criteria') return S.promotions.filter(p=>(p.criteriaIds||[]).includes(id)).length;
  if(kind==='purposes') return S.promotions.filter(p=>(p.purposeIds||[]).includes(id)).length;
  if(kind==='channels') return S.promotions.filter(p=>p.channelId===id).length;
  if(kind==='checklist') return S.promotions.filter(p=>(p.checklist||[]).some(c=>c.tplId===id)).length;
  return 0;
}

        <div style="display:flex;gap:8px;align-items:center;margin-top:4px;flex-wrap:wrap"><button type="button" class="btn xs" id="pmCadd">+ 구성품 추가</button><span class="note">구성품 합계 <b class="num">${fmt(componentsSum(p.components))}원</b></span>
        <label class="chk"><input type="radio" name="pmMode" value="auto" ${p.priceMode==='auto'?'checked':''}> 합계를 정상 단가로</label><label class="chk"><input type="radio" name="pmMode" value="manual" ${p.priceMode!=='auto'?'checked':''}> 세트 단가 직접 지정</label></div></div></div>`:''}
      <div class="f s4"><label>${p.type==='event'?'판매가 (있을 때)':'정상 단가 (평소 판매 단가)'}</label><input type="number" min="0" data-pm="price" value="${esc(p.type==='set'&&p.priceMode==='auto'?componentsSum(p.components):p.price)}" ${p.type==='set'&&p.priceMode==='auto'?'disabled':''}></div>
      <div class="f s4"><label>원가 ${p.type==='event'?'(사은품 원가 계산에 사용)':'(선택)'}</label><input type="number" min="0" data-pm="cost" value="${esc(p.cost)}"></div>
      <div class="f s4"><label>가용 재고 (참고)</label><input type="number" min="0" data-pm="stock" value="${esc(p.stock)}"></div>
      <div class="f s12"><label>행사 할인 미리보기</label><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><input type="number" min="0" max="100" id="pmDisc" placeholder="할인율 %" style="width:110px"><span class="note">적용 시 판매금액</span><span class="calc-sale num" id="pmDiscOut">-</span><span class="note" id="pmDiscNote"></span></div></div>
      <div class="f s12"><label>메모 (주의 표현, 판매 상태 등)</label><input type="text" data-pm="note" value="${esc(p.note)}"></div>
      <div class="f s12" style="flex-direction:row;align-items:center;gap:12px"><label class="chk"><input type="checkbox" data-pm="active" ${p.active!==false?'checked':''}> 활성 (기획전 상품 선택 목록에 표시)</label><span class="note">사용 중인 기획전 ${used}건</span></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:14px;align-items:center"><button type="button" class="btn primary" id="pmSave">${p.id?'저장':'상품 등록'}</button>${p.id?`<button type="button" class="btn" id="pmDup">복제</button>`:''}<span class="spacer"></span>${p.id?(used?'<span class="note">사용 중인 상품은 삭제 대신 비활성화하세요</span>':'<button type="button" class="btn danger" id="pmDel">삭제</button>'):''}<span id="pmDelC"></span></div>`;
    $$('[data-pm]',E).forEach(inp=>inp.addEventListener(inp.type==='checkbox'?'change':(inp.tagName==='SELECT'?'change':'input'), ()=>{ const k=inp.dataset.pm; if(k==='active') p.active=inp.checked; else p[k]=inp.value; if(k==='type'){ if(p.type==='set' && !p.components.length) p.components=[{productId:'',qty:1}]; renderEdit(); } if(k==='price') updateDisc(); }));
    $$('.crow',E).forEach(cr=>{ const ci=Number(cr.dataset.ci); $$('[data-ck]',cr).forEach(inp=>inp.addEventListener('change', ()=>{ p.components[ci][inp.dataset.ck]= inp.dataset.ck==='qty'?num(inp.value):inp.value; renderEdit(); })); $('[data-crm]',cr).addEventListener('click', ()=>{ p.components.splice(ci,1); renderEdit(); }); });
    const cadd=$('#pmCadd',E); if(cadd) cadd.addEventListener('click', ()=>{ p.components.push({productId:'',qty:1}); renderEdit(); });
    $$('input[name=pmMode]',E).forEach(r=>r.addEventListener('change', ()=>{ p.priceMode=r.value; if(p.priceMode==='manual' && !num(p.price)) p.price=String(componentsSum(p.components)); renderEdit(); }));
    const updateDisc=()=>{ const base = p.type==='set'&&p.priceMode==='auto'?componentsSum(p.components):num(p.price); const v=num($('#pmDisc',E).value); const out=$('#pmDiscOut',E); if(!base){ out.textContent='-'; $('#pmDiscNote',E).textContent='정상 단가를 먼저 입력하세요'; return; } const s=round10(base*(1-v/100)); out.textContent=fmt(s)+'원'; $('#pmDiscNote',E).textContent = v? `정상 ${fmt(base)}원 - ${v}% = 할인액 ${fmt(base-s)}원` : `정상 ${fmt(base)}원 (할인율을 입력하세요)`; };
    $('#pmDisc',E).addEventListener('input', updateDisc); updateDisc();
    $('#pmSave',E).addEventListener('click', async ()=>{
      if(!(p.name||'').trim()){ toast('상품명을 입력하세요'); return; }
      const doc = clone(p); if(!doc.id) doc.id=uid('pd'); doc.name=doc.name.trim(); doc.price = doc.type==='set'&&doc.priceMode==='auto'?componentsSum(doc.components):num(doc.price); doc.cost=num(doc.cost); doc.components=(doc.components||[]).filter(c=>c.productId).map(c=>({productId:c.productId,qty:num(c.qty)||1}));
      if(doc.type==='set' && !doc.spec) doc.spec = compText(doc.components);
      if(doc.type!=='set'){ doc.components=[]; doc.priceMode='manual'; }
      const i=S.products.findIndex(x=>x.id===doc.id); if(i>=0) S.products[i]=doc; else S.products.push(doc);
      await S.store.put('products', doc); curId=doc.id; draft=clone(doc); renderList(); renderEdit(); toast('상품을 저장했습니다');
    });
    const dup=$('#pmDup',E); if(dup) dup.addEventListener('click', ()=>{ draft=clone(p); draft.id=null; draft.name=p.name+' (복사)'; draft.order=S.products.length; curId=null; renderList(); renderEdit(); });
    const del=$('#pmDel',E); if(del) del.addEventListener('click', ()=>{ const c=$('#pmDelC',E); c.innerHTML=`<span class="confirm">삭제할까요? <button type="button" class="btn xs danger" id="pmDelY">삭제</button><button type="button" class="btn xs ghost" id="pmDelN">취소</button></span>`; $('#pmDelY',E).addEventListener('click', async ()=>{ await S.store.remove('products', p.id); curId=null; draft=null; renderList(); renderEdit(); toast('삭제했습니다'); }); $('#pmDelN',E).addEventListener('click', ()=>{ c.innerHTML=''; }); });
  }
  if(curId){ draft=clone(productById(curId)); }
  renderList(); renderEdit();
}

/* ---------------- AI 기획 프롬프트 ---------------- */
const IMPORT_FORMAT = 'lifemeal-md-board/promotion';
function buildPromptText(ctx){
  ctx=ctx||{};
  const L=_buildPromptHead(ctx);
  _buildPromptTail(L, ctx);
  return L.join('\n');
}
function _buildPromptHead(ctx){

  L.push('');

  L.push('2. 정보가 모이면 아래 형식과 기준에 맞춘 기획 가이드를 표 형태로 제시합니다 - 기획전명 후보, 기준·목적 선택 근거, 기간(주차), 상품 구성과 행사가, 혜택, 예산 항목별 추정치, 목표 매출과 예상 ROAS, 체크리스트 우선순위, 리스크(동시 진행 기획전 수 포함).');
  L.push('3. 사용자가 확정하면 최종 결과를 "출력 형식"의 JSON 하나로만 만들어 파일로 제공합니다. 파일명은 기획전_<기획전명>.json 입니다. 파일 생성이 어려우면 JSON 코드 블록 하나만 출력합니다. JSON 앞뒤에 설명을 붙이지 않습니다.');
  L.push('');
  L.push('## 기획 규칙');
  L.push('- 채널·기준·목적·상품은 반드시 참고 데이터의 id를 사용합니다. 꼭 필요한데 목록에 없는 기준·목적은 새 이름 문자열로 넣을 수 있습니다 (대시보드가 자동 등록).');
  L.push(`- 기간은 ${YEAR}년 9월 1일 ~ 12월 31일 안에서 잡습니다. 대시보드는 각 월을 1~7일 / 8~14일 / 15~21일 / 22~28일 / 29일~말일의 5주차로 나눕니다.`);
  L.push(`- 동시 진행 기획전은 전 채널 합산 최대 ${CONCURRENT_MAX}건까지입니다(디자인·운영 부하 기준). ${CONCURRENT_LIMIT}건 이상 겹치면 리스크로 표시하므로, 아래 "현재 등록된 기획전"을 보고 겹침을 피하거나 근거를 적습니다.`);
  L.push('- 상품 가격: 정상 단가는 참고 데이터의 price를 그대로 쓰고, 할인은 discount {type: pct(할인율) | amt(할인액) | price(행사가 직접), value}로 표현합니다. 행사가는 10원 단위로 반올림합니다.');
  L.push('- 세트 상품은 참고 데이터의 세트(type set)를 쓰거나, components에 구성품 productId와 qty를 넣어 새로 구성합니다. 새 세트의 price를 비우면 구성품 정상가 합계가 정상 단가가 됩니다.');
  L.push('- 이벤트 상품(type event)은 사은품·포장·샘플입니다. qtyPerOrder(주문당 수량), cost(단위 원가), condition(지급 조건)을 적습니다.');
  L.push('- 예산: 이 기획전을 위해 추가로 투입하는 비용만 넣습니다. goal.ad(광고비), goal.discount(쿠폰·할인 분담금 중 실제 지급분), goal.giftCost(새로 구매하는 사은품 구매비), goal.prod(외주 디자인·콘텐츠 제작비), goal.fee(오픈마켓 기획전 구좌·노출 비용), goal.logistics(추가 물류비), goal.etc(기타). 상품 할인에 따른 매출 감소분, 기존 재고를 사은품으로 쓰는 원가, 판매 수수료는 예산에 넣지 않습니다(0). 총예산 = 위 항목 합계, 예상 ROAS = 목표 매출 ÷ 총예산. 금액을 모르면 0으로 두고 memo에 "확정 필요"라고 적습니다.');
  L.push('- 고객 노출 문구(혜택, 상품 설명)는 짧고 객관적으로 씁니다. 질병 예방·치료 효능 표현, 최상급 표현(1위·최고), 라벨 근거가 없는 수치는 쓰지 않습니다. 브랜드 가치와 원료 출처가 자연스럽게 드러나되 의학적 효능 주장으로 읽히지 않게 합니다.');
  L.push('- 상태는 아래 진행 상태 목록 중 하나를 쓰고, 새 기획이면 보통 "아이디어" 또는 "검토 중"으로 둡니다.');
  L.push('');
  L.push('## 참고 데이터');
  refDataLines(L);
  L.push('### 현재 등록된 기획전 (채널 | 기획전명 | 기간 | 상태) - 겹침 확인용');
  const live = S.promotions.filter(p=>!p.archived && p.status!=='취소').sort((a,b)=>(a.start||'').localeCompare(b.start||''));
  if(!live.length) L.push('- (없음)');
  live.forEach(p=>{ const ch=byId(S.channels,p.channelId); L.push(`- ${ch?ch.name:'-'} | ${p.name} | ${p.start}~${p.end} | ${p.status}`); });
  return L;
}
function refDataLines(L){
  L.push('### 판매 채널 (id | 채널명 | 성격)');
  sorted(S.channels).filter(c=>c.active!==false).forEach(c=>L.push(`- ${c.id} | ${c.name} | ${c.desc||''}`));
  L.push('### 기획전 기준 (id | 기준명 | 설명) - 복수 선택');
  sorted(S.criteria).filter(c=>c.active!==false).forEach(c=>L.push(`- ${c.id} | ${c.name}${c.desc?' | '+c.desc:''}`));
  L.push('### 기획전 목적 (id | 목적명) - 복수 선택');
  sorted(S.purposes).filter(c=>c.active!==false).forEach(c=>L.push(`- ${c.id} | ${c.name}`));
  L.push('### 진행 상태');
  L.push('- '+STATUSES.join(' / '));
  L.push('### 기본 체크리스트 (실행 준비 항목)');
  sorted(S.checklist).forEach(c=>L.push(`- ${c.name}`));
  L.push('### 상품 마스터 (id | 유형 | 상품명 | 규격·구성 | 정상 단가(원) | 원가(원) | 메모)');
  sorted(S.products).filter(p=>p.active!==false).forEach(p=>{
    const comp = p.type==='set' ? ' | 구성: '+(p.components||[]).map(c=>c.productId+' x '+c.qty).join(', ') : '';
    L.push(`- ${p.id} | ${PRODUCT_TYPES[p.type]} | ${p.name} | ${p.spec||''} | ${fmt(masterPrice(p))} | ${fmt(p.cost)}${p.note?' | '+p.note:''}${comp}`);
  });
}
function _buildPromptTail(L, ctx){

  L.push('```json');
  L.push(JSON.stringify({
    format: IMPORT_FORMAT, version: 1,
    promotions: [{
      name: '기획전명', channel: '채널 id (예: ch_naver)', start: `${YEAR}-10-05`, end: `${YEAR}-10-18`,
      status: '검토 중', owner: '담당자명', deadline: `${YEAR}-09-25`,
      criteria: ['cr_1', '목록에 없으면 새 기준명'], purposes: ['pu_2'],
      background: { why: '왜 지금', whyChannel: '왜 이 채널', link: '시즌·키워드와 상품 연결 이유', behavior: '기대하는 고객 행동' },
      target: '대상 고객',
      products: [
        { type: 'single', productId: 'pd_daily14', discount: { type: 'pct', value: 20 }, stock: 800, targetQty: 300 },
        { type: 'set', name: '새 세트명 (마스터에 없을 때)', components: [ { productId: 'pd_daily14', qty: 1 }, { productId: 'pd_drsalad14', qty: 2 } ], price: 0, discount: { type: 'price', value: 59000 }, stock: 300, targetQty: 150 },
        { type: 'event', productId: 'pd_ev_coolbag', qtyPerOrder: 1, cost: 7000, condition: '10만 원 이상 구매 시' }
      ],
      gift: '사은품 요약 (카드 표시)', coupon: '쿠폰 또는 포인트', benefit: '핵심 고객 혜택 한 줄 (카드 표시)',
      goal: { sales: 0, qty: 0, ad: 0, discount: 0, giftCost: 0, prod: 0, fee: 0, logistics: 0, etc: 0 },
      checklist: ['상품 구성 확정', '가격 협의 완료'],
      memo: '내부 메모 · 가정한 수수료율 등', links: [ { title: '참고', url: 'https://' } ], contact: '채널 담당자 연락 정보'
    }]
  }, null, 2));
  L.push('```');
  L.push('필드 설명: products[].price는 정상 단가를 바꿔야 할 때만 넣습니다(기본은 마스터 단가). discount.type이 price면 value가 행사가입니다. checklist는 이름 배열 또는 {name, done} 배열 모두 가능합니다. 모든 금액은 원 단위 정수입니다. 하나의 파일에 기획전을 여러 개 넣어도 됩니다.');
  if(ctx.draft && ctx.draft.name){ L.push(''); L.push('## 현재 작성 중인 기획전 (참고)'); L.push(JSON.stringify(exportPromotionJSON(ctx.draft), null, 2)); }
}
// 기획전 1건 수정용 프롬프트: 현재 내용 + 참고 데이터 + 같은 형식으로 돌려 달라는 지시
function buildEditPromptText(p){
  const n=normalizePromotion(p); const ch=byId(S.channels,n.channelId);
  const L=[];
  L.push(`# 라이프밀 기획전 수정 요청 - ${n.name}`);
  L.push(`생성일 ${todayISO()} · 라이프밀 MD 프로모션 보드에서 내보낸 파일입니다.`);
  L.push('');

function findByIdOrName(list, v){ if(v==null||v==='') return null; const s=String(v).trim().toLowerCase(); return list.find(x=>x.id===v) || list.find(x=>(x.name||'').toLowerCase()===s) || list.find(x=>(x.name||'').toLowerCase().includes(s) && s.length>=2) || null; }
function importOne(src, warnings, pending){ // src: 파일 형식 한 건 → 대시보드 promotion draft. 새 기준·목적은 pending에 모아 두었다가 생성
  const d = newPromotion({});
  warnings = warnings||[];
  d.name = String(src.name||'').trim(); if(!d.name) warnings.push('기획전명이 비어 있어 "이름 없는 기획전"으로 넣습니다.'), d.name='이름 없는 기획전';
  const ch = findByIdOrName(S.channels, src.channel||src.channelId||src.channelName); if(ch) d.channelId=ch.id; else warnings.push(`채널 "${src.channel||''}"을 찾지 못해 첫 번째 채널로 넣습니다.`);
  const okDate = (s)=> /^\d{4}-\d{2}-\d{2}$/.test(String(s||''));
  if(okDate(src.start)) d.start=src.start; else warnings.push('시작일 형식이 잘못되어 9월 1일로 넣습니다 (YYYY-MM-DD).');
  if(okDate(src.end)) d.end=src.end; else { d.end=addDays(d.start,6); warnings.push('종료일 형식이 잘못되어 시작일 + 6일로 넣습니다.'); }
  if(d.end<d.start){ d.end=d.start; warnings.push('종료일이 시작일보다 빨라 시작일과 같게 맞췄습니다.'); }
  d.status = STATUSES.includes(src.status)?src.status:'아이디어'; if(src.status && !STATUSES.includes(src.status)) warnings.push(`상태 "${src.status}"는 목록에 없어 아이디어로 넣습니다.`);
  d.owner = String(src.owner||''); d.deadline = okDate(src.deadline)?src.deadline:''; d.theme = String(src.theme||''); d._srcId = src.id && S.promotions.some(p=>p.id===src.id) ? src.id : null;
  const mapTerms = (arr, list, kind)=> (Array.isArray(arr)?arr:[]).map(v=>{ const f=findByIdOrName(list, v); if(f) return f.id; const name=String(v||'').trim(); if(!name) return null; const key=kind+':'+name; if(!pending[key]) pending[key]={kind,name}; return key; }).filter(Boolean);
  d.criteriaIds = mapTerms(src.criteria||src.criteriaIds, S.criteria, 'criteria');
  d.purposeIds = mapTerms(src.purposes||src.purposeIds, S.purposes, 'purposes');
  const bg = src.background||src.bg||{}; d.bg={why:String(bg.why||''),whyChannel:String(bg.whyChannel||''),link:String(bg.link||''),behavior:String(bg.behavior||'')};
  d.target=String(src.target||''); d.gift=String(src.gift||''); d.coupon=String(src.coupon||''); d.benefit=String(src.benefit||''); d.memo=String(src.memo||''); d.contact=String(src.contact||'');
  d.products = (Array.isArray(src.products)?src.products:[]).map(x=>{
    const it = normalizeLine({kind: x.type==='event'?'event':(x.type==='set'||(x.components&&x.components.length)?'set':'single')});
    const p = findByIdOrName(S.products, x.productId||x.name);
    if(p){ it.productId=p.id; it.name=p.name; it.price=String(masterPrice(p)); it.cost=String(num(p.cost)); it.comp=p.spec||''; if(p.type==='set'){ it.kind='set'; it.components=clone(p.components||[]); it.comp=compText(it.components); } if(p.type==='event') it.kind='event'; }
    else { it.productId = it.kind==='set'?'':'__manual'; if(x.productId) warnings.push(`상품 "${x.productId}"을 마스터에서 찾지 못해 직접 입력 상품으로 넣습니다.`); }
    if(x.name && !p) it.name=String(x.name); else if(x.name && p && x.name!==p.name) it.name=String(x.name);
    if(it.kind==='set' && Array.isArray(x.components) && x.components.length){ it.components = x.components.map(c=>{ const cp=findByIdOrName(S.products, c.productId||c.name); if(!cp) warnings.push(`세트 구성품 "${c.productId||c.name}"을 찾지 못했습니다.`); return {productId:cp?cp.id:'', qty:num(c.qty)||1, name:cp?undefined:String(c.name||c.productId||'')}; }); it.comp = compText(it.components); if(!num(x.price)) it.price=String(componentsSum(it.components)); }
    if(x.comp) it.comp=String(x.comp); if(x.price!=null && num(x.price)) it.price=String(num(x.price));
    if(it.kind==='event'){ it.qty=String(num(x.qtyPerOrder||x.qty)||1); if(x.cost!=null) it.cost=String(num(x.cost)); it.cond=String(x.condition||x.cond||''); it.stock = x.stock!=null?String(num(x.stock)):''; return it; }
    const dc = x.discount||{}; if(dc.type==='pct'||dc.type==='amt'){ it.discType=dc.type; it.discVal=String(num(dc.value)); } else if(dc.type==='price' || x.salePrice!=null){ it.discType='price'; it.salePrice=String(num(dc.type==='price'?dc.value:x.salePrice)); } else { it.discType='pct'; it.discVal=''; }
    it.stock = x.stock!=null?String(num(x.stock)):''; it.qty = (x.targetQty!=null||x.qty!=null)?String(num(x.targetQty!=null?x.targetQty:x.qty)):'';
    return it;
  });
  const g = src.goal||{}; Object.keys(d.goal).forEach(k=>{ d.goal[k] = g[k]!=null && g[k]!=='' ? String(num(g[k])) : ''; });
  if(Array.isArray(src.checklist) && src.checklist.length){ d.checklist = src.checklist.map(c=> typeof c==='string' ? {id:uid('ci'),name:c,done:false} : {id:uid('ci'),name:String(c.name||''),done:!!c.done}).filter(c=>c.name); const tplNames = new Set(d.checklist.map(c=>c.name)); d.checklist.forEach(c=>{ const t=S.checklist.find(x=>x.name===c.name); if(t) c.tplId=t.id; }); void tplNames; }
  d.links = (Array.isArray(src.links)?src.links:[]).filter(l=>l&&l.url).map(l=>({id:uid('lk'),title:String(l.title||l.url),url:String(l.url)}));
  return d;
}
function parseImportFile(text){
  let obj; try{ obj=JSON.parse(text); }catch(e){ // 코드 블록 안 JSON 허용
    const m = text.match(/```(?:json)?\s*([\s\S]*?)```/); if(m){ try{ obj=JSON.parse(m[1]); }catch(_){ } }
    if(!obj){ const i=text.indexOf('{'), j=text.lastIndexOf('}'); if(i>=0&&j>i){ try{ obj=JSON.parse(text.slice(i,j+1)); }catch(_){ } } }
  }
  if(!obj) throw new Error('JSON을 읽을 수 없습니다. AI가 만든 JSON 파일 또는 JSON 코드 블록을 넣어 주세요.');
  let list = Array.isArray(obj) ? obj : (Array.isArray(obj.promotions) ? obj.promotions : (obj.name ? [obj] : null));
  if(!list) throw new Error('promotions 배열이나 기획전 객체를 찾지 못했습니다.');
  if(obj.format && obj.format!==IMPORT_FORMAT) console.warn('format 값이 다릅니다:', obj.format);
  return list;
}
async function resolvePending(pending, d){ // 새 기준·목적 생성 후 id 치환
  const map={};
  for(const key of Object.keys(pending)){
    const {kind,name}=pending[key];
    const list=S[kind]; let f=list.find(x=>x.name===name);
    if(!f){ f = kind==='criteria' ? {id:uid('cr'),name,desc:'파일로 넣기에서 자동 등록',color:PALETTE[list.length%PALETTE.length],order:list.length,active:true} : {id:uid('pu'),name,order:list.length,active:true}; list.push(f); await S.store.put(kind,f); }
    map[key]=f.id;
  }
  d.criteriaIds = d.criteriaIds.map(k=>map[k]||k); d.purposeIds = d.purposeIds.map(k=>map[k]||k);
}

$('#btnPrompt').addEventListener('click', ()=>openPromptBuilder());
$('#btnImport').addEventListener('click', ()=>openImportPromo());
$('#btnSettings').addEventListener('click', ()=>openSettings('channels'));
$$('.viewtabs button').forEach(b=>b.addEventListener('click', ()=>{ S.view=b.dataset.view; $$('.viewtabs button').forEach(x=>x.classList.toggle('on',x===b)); $('#calwrap').hidden = S.view!=='cal'; $('#ganttwrap').hidden = S.view!=='gantt'; $('#listwrap').hidden = S.view!=='list'; renderAll(); }));
const F = {fMonth:'month',fChannel:'channel',fCriteria:'criteria',fPurpose:'purpose',fStatus:'status',fOwner:'owner'};
Object.keys(F).forEach(id=> $('#'+id).addEventListener('change', e=>{ S.filters[F[id]]=e.target.value; renderAll(); }));
$('#fSearch').addEventListener('input', debounce(e=>{ S.filters.q=e.target.value.trim(); renderAll(); },200));
$('#fArchived').addEventListener('change', e=>{ S.filters.archived=e.target.checked; renderAll(); });
$('#fInactiveCh').addEventListener('change', e=>{ S.filters.inactiveCh=e.target.checked; renderAll(); });
$('#fReset').addEventListener('click', ()=>{ S.filters={month:'',channel:'',criteria:'',purpose:'',status:'',owner:'',q:'',archived:false,inactiveCh:false}; $('#fSearch').value=''; $('#fArchived').checked=false; $('#fInactiveCh').checked=false; renderAll(); });

/* ---------------- 초기화 ---------------- */
function setStorageBadge(kind){ const b=$('#storageBadge'); b.className='storage '+(kind==='firebase'?'db':kind); b.querySelector('span').textContent = kind==='db' ? '공유 DB 연결됨 · 팀 실시간 동기화' : kind==='firebase' ? 'Firebase 연결됨 · 팀 실시간 동기화' : '이 브라우저에 저장 중 (localStorage)'; b.title = kind==='db' ? '아티팩트 공유 DB에 저장됩니다.' : kind==='firebase' ? '라이프밀 Firebase(/mdboard)에 저장됩니다. 같은 링크를 여는 팀원과 실시간으로 공유됩니다.' : '공유 DB를 사용할 수 없어 이 브라우저에만 저장됩니다. 설정 > 데이터 · 백업에서 내보내기/가져오기가 가능합니다.'; }
async function boot(){
  let store = null;
  try{
    if(window.claude && typeof window.claude.use==='function'){
      const db = await Promise.race([window.claude.use('db'), new Promise(r=>setTimeout(()=>r(null), 12000))]);
      if(db) store = new DbStore(db);
    }
  }catch(e){ console.warn('db 사용 불가, 로컬 저장으로 전환', e); }
  if(!store && window.firebase && window.MDBOARD_FIREBASE){
    try{
      if(!firebase.apps.length) firebase.initializeApp(window.MDBOARD_FIREBASE.config);
      if(firebase.auth){ try{ await firebase.auth().signInAnonymously(); }catch(e){ console.warn('익명 로그인 실패 - 저장이 안 될 수 있습니다', e); } }
      store = new FirebaseStore(firebase, window.MDBOARD_FIREBASE.path||'/mdboard');
    }catch(e){ console.warn('firebase 사용 불가, 로컬 저장으로 전환', e); store=null; }
  }
  if(!store) store = new LocalStore();
  S.store = store;
  try{ const snap = await store.init(); setStorageBadge(store.kind); store.subscribe(applySnapshot); applySnapshot(snap); }
  catch(e){ console.warn('저장소 초기화 실패, 로컬 저장으로 전환', e); store = new LocalStore(); S.store=store; const snap=await store.init(); setStorageBadge('local'); store.subscribe(applySnapshot); applySnapshot(snap); }
  // 오늘 주차로 가로 스크롤
  const t = weekIndexOf(todayISO()); if(t!=null && t>=0 && t<WEEKS.length){ const wrap=$('#calwrap'); const c1=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--c1')), c2=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--c2')), wk=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--wk')); wrap.scrollLeft = Math.max(0, t*wk - wk); void c1; void c2; }
}
// 테스트·외부 연동용 최소 API
window.MDBoard = { get state(){ return S; }, WEEKS, weekIndexOf, budgetOf, openForm:(pre)=>openForm(newPromotion(pre||{})), openDetail, openSettings, openProducts, openPromptBuilder, openImportPromo, buildPromptText, importOne, lineSalePrice, masterPrice };
boot();
})();
</script>
