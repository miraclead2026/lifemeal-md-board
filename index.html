<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<title>라이프밀 MD 프로모션 보드</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap">
<style>
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface2:#F8FAFC; --line:#DDE2E9; --line2:#EDF0F4;
  --text:#1B2434; --muted:#6A7484; --faint:#98A2B3;
  --accent:#1F3A5F; --accent-soft:#E6EDF6; --accent-text:#FFFFFF;
  --warn:#B45309; --warn-bg:#FEF3C7; --danger:#B42318; --danger-bg:#FEE4E2; --ok:#067647; --ok-bg:#DCFAE6;
  --shadow:0 1px 2px rgba(20,30,50,.06),0 4px 14px rgba(20,30,50,.06);
  --c1:150px; --c2:230px; --wk:168px; --radius:6px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151C; --surface:#1A1F28; --surface2:#20262F; --line:#2C3440; --line2:#252C36;
    --text:#E6EAF0; --muted:#A0A9B8; --faint:#6C7684;
    --accent:#9DBCE8; --accent-soft:#1E2A3B; --accent-text:#0F1622;
    --warn:#F5B453; --warn-bg:#3A2A12; --danger:#F08A82; --danger-bg:#3D1A18; --ok:#6FD39A; --ok-bg:#12341F;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11151C; --surface:#1A1F28; --surface2:#20262F; --line:#2C3440; --line2:#252C36;
  --text:#E6EAF0; --muted:#A0A9B8; --faint:#6C7684;
  --accent:#9DBCE8; --accent-soft:#1E2A3B; --accent-text:#0F1622;
  --warn:#F5B453; --warn-bg:#3A2A12; --danger:#F08A82; --danger-bg:#3D1A18; --ok:#6FD39A; --ok-bg:#12341F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font-family:Pretendard,"Pretendard Variable","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:13px;line-height:1.45;font-weight:400;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
h1,h2,h3,h4{margin:0;font-weight:500;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---------- app shell ---------- */
.app{display:flex;flex-direction:column;min-height:100vh}
.topbar{display:flex;align-items:center;gap:14px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.brand{display:flex;flex-direction:column;gap:1px;min-width:220px}
.brand h1{font-size:16px;letter-spacing:-.01em}
.brand .sub{font-size:11.5px;color:var(--muted)}
.spacer{flex:1}
.storage{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface2)}
.storage i{width:7px;height:7px;border-radius:50%;background:var(--faint);display:inline-block}
.storage.db i{background:var(--ok)}
.storage.local i{background:var(--warn)}

.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--text);font-size:12.5px;font-weight:500;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface2);border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.xs{padding:2px 7px;font-size:11.5px;border-radius:4px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface2)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger:hover{background:var(--danger-bg)}
.btn.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* ---------- summary ---------- */
.summary{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr)) minmax(420px,1.8fr);gap:10px;padding:14px 20px 0}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.tile .lab{font-size:11.5px;color:var(--muted);letter-spacing:.01em}
.tile .val{font-size:24px;font-weight:500;letter-spacing:-.02em;line-height:1.1}
.tile .val small{font-size:12px;color:var(--muted);font-weight:400;margin-left:3px}
.tile.warn .val{color:var(--warn)}
.tile.ok .val{color:var(--ok)}
.mtable{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:8px 14px;overflow-x:auto}
.mtable table{width:100%;border-collapse:collapse;font-size:12px}
.mtable th{font-weight:500;color:var(--muted);text-align:right;padding:4px 6px;border-bottom:1px solid var(--line2);font-size:11.5px}
.mtable th:first-child,.mtable td:first-child{text-align:left;color:var(--muted);white-space:nowrap}
.mtable td{text-align:right;padding:4px 6px;white-space:nowrap}
.mtable tr.tot td{border-top:1px solid var(--line2);font-weight:500}

/* ---------- toolbar / filters ---------- */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 20px}
.toolbar select,.toolbar input[type=search]{padding:6px 8px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);font-size:12.5px;min-width:0}
.toolbar input[type=search]{min-width:240px}
.toolbar .lbl{font-size:11.5px;color:var(--muted);margin-left:4px}
.toolbar .grp{display:flex;align-items:center;gap:4px}
.viewtabs{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.viewtabs button{border:0;background:var(--surface);padding:6px 12px;font-size:12.5px;color:var(--muted)}
.viewtabs button.on{background:var(--accent);color:var(--accent-text)}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);cursor:pointer;user-select:none}

/* ---------- calendar ---------- */
.calwrap{margin:0 20px 24px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:auto;max-height:calc(100vh - 118px);position:relative}
.cal{display:inline-block;min-width:100%}
.row{display:grid;grid-template-columns:var(--c1) var(--c2) repeat(20,var(--wk));grid-auto-rows:minmax(0,auto);border-bottom:1px solid var(--line);position:relative}
.row:last-child{border-bottom:0}
.hd .cell{background:var(--surface2)}
.cell{border-right:1px solid var(--line2);min-width:0}
.cell.sticky{position:sticky;z-index:5;background:var(--surface)}
.cell.sticky.c1{left:0}
.cell.sticky.c2{left:var(--c1);border-right:1px solid var(--line)}
.hd .cell.sticky{background:var(--surface2);z-index:12}
.hd{position:sticky;z-index:10}
.hd.months{top:0}
.hd.weeks{top:34px}
.hd .corner{display:flex;align-items:center;padding:0 12px;font-size:11.5px;color:var(--muted);font-weight:500;height:34px}
.hd.weeks .corner{height:auto;min-height:46px;align-items:center}
.mcell{display:flex;align-items:center;justify-content:space-between;padding:0 12px;height:34px;font-size:13px;font-weight:500;border-right:1px solid var(--line);grid-column:span 5}
.mcell .mb{font-size:11px;color:var(--muted);font-weight:400}
.mcell:nth-of-type(odd){background:var(--surface2)}
.wcell{padding:6px 10px;min-height:46px;display:flex;flex-direction:column;justify-content:center;gap:1px}
.wcell .wn{font-size:12px;font-weight:500}
.wcell .wd{font-size:10.5px;color:var(--faint)}
.wcell.over .wn{color:var(--danger)}
.wcell .cnt{font-size:10.5px;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.wcell .cnt b{font-weight:500}
.wcell.over .cnt{color:var(--danger)}
.wcell.full .cnt{color:var(--warn)}
.wcell.mstart{border-left:2px solid var(--line)}
.row .slot.mstart{border-left:2px solid var(--line)}
.wcell.today{box-shadow:inset 0 -2px 0 var(--accent)}

.chn{padding:10px 12px;display:flex;flex-direction:column;gap:4px;grid-column:1;grid-row:1 / -1}
.chn .name{font-weight:500;font-size:13px}
.chn .meta{font-size:11px;color:var(--faint)}
.chd{padding:10px 12px;font-size:11.5px;color:var(--muted);line-height:1.4;grid-column:2;grid-row:1 / -1}
.chn,.chd{cursor:text}
.chn:hover,.chd:hover{background:var(--surface2)}
.chd .edit,.chn .edit{width:100%;border:1px solid var(--accent);border-radius:4px;padding:4px 6px;background:var(--surface);font-size:12px;resize:vertical;min-height:54px}
.chn .edit{min-height:0}
.slot{position:relative;min-height:112px;border-right:1px solid var(--line2);background:transparent}
.slot:hover{background:var(--surface2)}
.slot .addbtn{position:absolute;inset:auto 6px 6px 6px;opacity:0;pointer-events:none;border:1px dashed var(--faint);background:var(--surface);color:var(--muted);border-radius:4px;padding:4px 0;font-size:11.5px;text-align:center;transition:opacity .1s}
.slot:hover .addbtn{opacity:1;pointer-events:auto}
.slot .addbtn:hover{border-color:var(--accent);color:var(--accent)}
.slot.dragover{background:var(--accent-soft);outline:1px dashed var(--accent);outline-offset:-2px}
.slot.over{background:repeating-linear-gradient(135deg,transparent 0 10px,var(--danger-bg) 10px 12px)}
.slot.over:hover{background:repeating-linear-gradient(135deg,var(--surface2) 0 10px,var(--danger-bg) 10px 12px)}
.slot.full{background:repeating-linear-gradient(135deg,transparent 0 10px,var(--warn-bg) 10px 12px)}

/* ---------- card ---------- */
.card{position:relative;z-index:2;margin:6px 6px 0 6px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--cc,var(--accent));border-radius:5px;padding:7px 9px 7px 9px;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0;align-self:start;transition:border-color .12s}
.card:hover{border-color:var(--faint);border-left-color:var(--cc,var(--accent))}
.card.dragging{opacity:.45}
.card.archived{opacity:.55;border-style:dashed}
.card .top{display:flex;align-items:center;gap:4px;min-width:0}
.card .tags{display:flex;gap:3px;min-width:0;overflow:hidden;flex:1}
.tag{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:3px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;background:var(--tc,#555);font-weight:500;line-height:1.5}
.tag.more{background:var(--line);color:var(--muted)}
.st{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:999px;white-space:nowrap;font-weight:500;line-height:1.5;border:1px solid transparent;flex-shrink:0}
.card .nm{font-weight:500;font-size:12.5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .ln{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:4px;min-width:0}
.card .ln b{font-weight:500;color:var(--faint);flex-shrink:0}
.card .ln span{overflow:hidden;text-overflow:ellipsis}
.card .bt{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:11px;margin-top:2px;padding-top:4px;border-top:1px dashed var(--line2)}
.card .bt .bud{font-weight:500;color:var(--text)}
.card .bt .pr{color:var(--faint)}
.card .wb{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:var(--danger-bg);color:var(--danger);font-size:10px;font-weight:700;flex-shrink:0}
.card .ddl{color:var(--warn)}

/* ---------- list view ---------- */
.listwrap{margin:0 20px 24px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:auto}

/* ---------- report (main page): 주차 x 채널 계획표 ---------- */
body.report .summary,body.report .toolbar,body.report .viewtabs,body.report #calwrap,body.report #ganttwrap,body.report #listwrap{display:none!important}
body.report .topbar .btn:not(#btnMode):not(#btnNew){display:none}
body:not(.report) #report{display:none}
.report{margin:14px 20px 24px;background:var(--surface);border:1px solid #CBD2DC;border-radius:8px;padding:0;overflow:hidden}
.rp-head{display:flex;align-items:center;gap:16px;padding:14px 18px;border-bottom:1px solid #CBD2DC;flex-wrap:wrap;background:var(--surface)}
.rp-head h2{font-size:19px;font-weight:700;letter-spacing:-.01em}
.rp-head .sub{font-size:13px;color:var(--muted);margin-top:2px}
.rp-head .lg{display:flex;gap:14px;align-items:center;font-size:12.5px;color:var(--text);margin-left:8px}
.rp-head .lg i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-3px;margin-right:5px;border:1px solid transparent}
.rp-head .acts{margin-left:auto;display:flex;gap:6px}
.rp-head .mtabs{display:flex;gap:4px;margin-left:14px}
.rp-head .mtabs button{font:inherit;font-size:12.5px;padding:4px 10px;border:1px solid var(--line);background:var(--surface);border-radius:4px;cursor:pointer;color:var(--muted)}
.rp-head .mtabs button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.rp-scroll{overflow:auto;max-height:calc(100vh - 150px)}
.wtable{border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:13px}
.wtable col.cch{width:160px}
.wtable col.cwk{width:var(--ww,170px)}
.wtable.fit col.cwk{width:auto}
.wtable th,.wtable td{border-right:1px solid #D9DEE6;border-bottom:1px solid #D9DEE6;vertical-align:top}
.wtable thead th{position:sticky;z-index:5;background:#EEF2F7;color:var(--text);font-weight:700;text-align:left;padding:8px 10px;box-sizing:border-box}
.wtable thead tr.hm th{top:0;height:36px;font-size:14.5px;color:var(--accent);background:var(--accent-soft);border-bottom:1px solid #B9C2CF;text-align:center;padding:8px 10px}
.wtable thead tr.hm th .d{display:inline;font-size:12px;color:var(--muted);font-weight:400;margin-left:8px}
.wtable thead tr.hw th{top:36px;font-size:13.5px;border-bottom:2px solid #B9C2CF}
.wtable thead th .d{display:block;font-size:11.5px;color:var(--muted);font-weight:400;margin-top:1px}
.wtable th.chc,.wtable td.chc{position:sticky;left:0;z-index:4;background:#F7F9FC;width:160px;min-width:160px;border-right:2px solid #B9C2CF;padding:10px 12px;text-align:left}
.wtable thead th.chc{z-index:6;background:#EEF2F7;vertical-align:middle}
.wtable td.chc .w{font-size:14.5px;font-weight:700;display:block}
.wtable td.chc .r{font-size:12px;color:var(--muted);display:block;margin-top:3px;font-weight:400;white-space:normal;line-height:1.4}
.wtable td.chc .r.ds{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:11.5px}
.wtable td.ms,.wtable th.ms{border-left:2px solid #B9C2CF}
.wtable tr.chlast td{border-bottom:2px solid #B9C2CF}
.wtable td.cell{padding:5px;height:58px;cursor:pointer;position:relative}
.wtable td.cell:hover{background:#FBFCFE}
.wtable td.cell .add{position:absolute;right:5px;bottom:5px;font-size:11.5px;color:var(--faint);border:1px dashed var(--line);border-radius:4px;padding:1px 6px;background:var(--surface);opacity:0;pointer-events:none}
.wtable td.cell:hover .add{opacity:1}
.wtable td.bar{padding:5px}
.wtable tr.cnt td{background:#F7F9FC;text-align:center;font-weight:700;color:var(--muted);font-size:13.5px;padding:8px 4px;position:sticky;bottom:0;z-index:3;border-top:2px solid #B9C2CF}
.wtable tr.cnt td.chc{z-index:5}
.wtable tr.cnt td.chc .r{display:block;font-size:11.5px;font-weight:400;margin-top:2px}
.wtable tr.cnt td.over{color:var(--danger)}
.wtable tr.cnt td.full{color:var(--warn)}
.pb{border:1px solid #E5C48F;border-left:5px solid #F59E0B;background:#FFF4E2;border-radius:6px;padding:7px 9px;margin:0 0 5px;cursor:pointer;line-height:1.35}
.pb:hover{filter:brightness(.98)}
.pb.live{border-color:#9AD6B1;border-left-color:#16A34A;background:#E9F7EE}
.pb.done{border-color:#CBD2DC;border-left-color:#9CA3AF;background:#F1F3F6;color:var(--muted)}
.pb.draft{border:1px dashed #AAB3C0;border-left:5px solid #AAB3C0;background:#FFFFFF}
.pb .nm{font-weight:700;font-size:13.5px;color:var(--text);display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.pb .tag{font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:3px;background:#EEF1F5;color:#5B6472;white-space:nowrap}
.pb.draft .tag{background:#F3F4F6;color:#6B7280}
.pb .th{font-size:12px;color:#92400E;margin-top:2px;white-space:normal;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.pb.draft .th{color:#6B7280}
.pb .pd{font-size:12.5px;color:#3D4756;margin-top:3px;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pb .bf{font-size:12px;color:var(--muted);margin-top:2px;white-space:normal;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.pb.cont{padding:4px 9px;background:transparent;border-style:dashed;border-left-style:solid;opacity:.85}
.pb.cont .nm{font-size:12.5px;font-weight:600;color:var(--muted)}
.pb .rg{font-size:11.5px;color:var(--muted);font-weight:500;white-space:nowrap}
.pb .nm .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pb.n1 .bf{display:none}
.pb.n1 .nm .t{font-size:13px}
.pb.cutL{border-left-style:dashed;border-left-width:3px}
.pb.cutR{border-right-style:dashed}
.rp-note{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:10px 18px;border-top:1px solid #CBD2DC;background:#FFFBEB;color:#92400E;font-size:12.5px;line-height:1.5}
@media print{ @page{size:landscape} body.report .topbar{display:none!important} body.report .report{margin:0;border:0} .rp-scroll{max-height:none;overflow:visible} .rp-head .acts,.rp-head .mtabs{display:none} .wtable td.cell .add{display:none} .wtable{width:100%!important} .wtable col.cwk{width:auto} }
/* compact detail */
.dtag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:3px;background:#EEF1F5;color:#5B6472;vertical-align:middle;margin-left:6px}
.dtag.live{background:#E9F7EE;color:#166534}.dtag.fix{background:#FFF4E2;color:#92400E}.dtag.draft{background:#F3F4F6;color:#6B7280;border:1px dashed #AAB3C0}
.dv2 .dgrid{display:grid;grid-template-columns:120px 1fr;gap:12px 16px;padding:14px 0 4px;font-size:14px}
.dv2 .dk{color:var(--muted);font-size:13px;padding-top:2px}
.dv2 .dvv{line-height:1.5}
.dv2 .dp{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:5px 0;border-bottom:1px dashed var(--line2)}
.dv2 .dp.gift{display:block}
.dv2 .dp.gift .c{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;white-space:normal}
.dv2 .dp:last-child{border-bottom:0}
.dv2 .dp .n{font-weight:500;flex:1 1 auto;min-width:0}
.dv2 .dp .pr{color:var(--muted);white-space:nowrap}

/* quick form */
.qf .fg{grid-template-columns:repeat(12,1fr)}
.qf .plist{max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:var(--radius);padding:4px 8px;display:grid;grid-template-columns:1fr 1fr;gap:2px 12px}
.qf .plist label{display:flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 0;cursor:pointer}
.qf .plist .cat{grid-column:1 / -1;font-size:11px;color:var(--muted);font-weight:600;margin-top:6px}

/* ---------- gantt view ---------- */
.ganttwrap{margin:0 20px 24px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:auto;max-height:calc(100vh - 118px)}
.gt-bar{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);position:sticky;left:0}
.gtable{border-collapse:separate;border-spacing:0;font-size:12px;min-width:100%}
.gtable th,.gtable td{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:0;height:34px;white-space:nowrap}
.gtable thead th{position:sticky;background:var(--surface2);z-index:3;font-weight:500;color:var(--muted);font-size:11.5px;text-align:center}
.gtable thead tr:first-child th{top:0;height:30px}
.gtable thead tr:last-child th{top:30px;height:38px;border-bottom:1px solid var(--line)}
.gtable thead th.mth{font-size:12.5px;color:var(--text);border-left:2px solid var(--line);text-align:left;padding:0 10px}
.gtable thead th.wk{width:var(--gw,72px);min-width:var(--gw,72px);line-height:1.2}
.gtable thead th.wk .d{display:block;font-size:10px;color:var(--faint);font-weight:400}
.gtable thead th.wk.mstart,.gtable td.gc.mstart{border-left:2px solid var(--line)}
.gtable thead th.wk.full{color:var(--warn)}
.gtable thead th.wk.over{color:var(--danger)}
.gtable th.lc,.gtable td.lc{position:sticky;background:var(--surface);z-index:2;text-align:left;padding:0 10px;border-right:1px solid var(--line2)}
.gtable thead th.lc{z-index:4;background:var(--surface2)}
.gtable .lc.c1{left:0;width:110px;min-width:110px;max-width:110px}
.gtable .lc.c2{left:110px;width:240px;min-width:240px;max-width:240px;overflow:hidden;text-overflow:ellipsis;line-height:1.25;font-weight:500;padding:0 10px}
.gtable .lc.c2 .note{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10.5px}
.gtable .lc.c3{left:350px;width:220px;min-width:220px;max-width:220px;overflow:hidden;text-overflow:ellipsis;line-height:1.25;font-size:11px;color:var(--muted);padding:0 10px}
.gtable .lc.c3 div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gtable .lc.c4{left:570px;width:80px;min-width:80px;max-width:80px;font-size:11px;color:var(--muted);border-right:1px solid var(--line)}
.gtable tr.chh td{background:var(--accent-soft);color:var(--accent);font-weight:500;height:28px;padding:0 10px;font-size:12px;position:sticky;left:0}
.gtable tr.chh td.lc{background:var(--accent-soft)}
.gtable tr.gr{cursor:pointer}
.gtable tr.gr:hover td{background:var(--surface2)}
.gtable tr.gr:hover td.lc{background:var(--surface2)}
.gtable td.gc{position:relative;background:transparent}
.gtable td.gc.on{background:var(--gcol,#F59E0B)}
.gtable td.gc.on.idea{background:repeating-linear-gradient(135deg,var(--gcol) 0 6px,transparent 6px 9px);opacity:.75}
.gtable td.gc.on .lb{position:absolute;left:5px;top:7px;height:20px;line-height:20px;padding:0 7px;border-radius:3px;background:rgba(255,255,255,.9);color:#1B2434;font-size:11px;font-weight:500;white-space:nowrap;z-index:1;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.gtable tr.cnt td{background:var(--surface2);text-align:center;font-size:11px;color:var(--muted);height:26px}
.gtable tr.cnt td.over{color:var(--danger);font-weight:600}
.gtable tr.cnt td.full{color:var(--warn);font-weight:600}
.gt-legend{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:10px 12px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);position:sticky;left:0}
.gt-legend i{display:inline-block;width:22px;height:12px;border-radius:2px;vertical-align:-2px;margin-right:5px}
@media print{ .topbar,.summary,.toolbar,.gt-bar,#calwrap,#listwrap,#modalRoot,.toast{display:none!important} .ganttwrap{margin:0;border:0;max-height:none;overflow:visible} .gtable th,.gtable td{height:26px} .gtable td.gc.on .lb{font-size:10px} body{background:#fff} }
.ltable{width:100%;border-collapse:collapse;font-size:12.5px;min-width:1200px}
.ltable th{position:sticky;top:0;background:var(--surface2);text-align:left;font-weight:500;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);font-size:11.5px;white-space:nowrap;z-index:2}
.ltable td{padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:top;white-space:nowrap}
.ltable td.wrap{white-space:normal;max-width:260px}
.ltable tr:hover td{background:var(--surface2)}
.ltable td.r,.ltable th.r{text-align:right}
.ltable tr.mhead td{background:var(--accent-soft);color:var(--accent);font-weight:500;padding:6px 10px}
.ltable tr.clickable{cursor:pointer}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,16,28,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:28px 16px;overflow:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:8px;width:min(980px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;max-height:calc(100vh - 56px)}
.modal.narrow{width:min(720px,100%)}
.modal .mh{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:3;border-radius:8px 8px 0 0}
.modal .mh h2{font-size:15px}

.autosave{font-size:11.5px;color:var(--muted)}
.autosave.on{color:var(--ok)}
.sec{padding:16px 0 4px;border-bottom:1px solid var(--line2)}
.sec:last-child{border-bottom:0}
.sec h3{font-size:12px;color:var(--accent);letter-spacing:.04em;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sec h3 .hint{font-size:11px;color:var(--faint);letter-spacing:0;text-transform:none;font-weight:400}
.fg{display:grid;grid-template-columns:repeat(12,1fr);gap:10px 12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:11.5px;color:var(--muted)}
.f label .req{color:var(--danger)}
.f input,.f select,.f textarea{padding:7px 9px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);font-size:12.5px;width:100%;min-width:0}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);outline:none}
.f textarea{resize:vertical;min-height:58px}
.f .calc{padding:7px 9px;background:var(--surface2);border:1px solid var(--line2);border-radius:var(--radius);font-size:12.5px;color:var(--text);min-height:32px}
.f .calc.big{font-weight:500;font-size:14px}
.f .calc.neg{color:var(--danger)}
.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}.s6{grid-column:span 6}.s12{grid-column:span 12}
.err{color:var(--danger);font-size:11.5px}
.note{font-size:11.5px;color:var(--muted)}
.warnbox{display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--warn-bg);color:var(--warn);border-radius:var(--radius);font-size:12px;margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:12px;cursor:pointer;user-select:none;transition:background .1s}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--tc,var(--faint));display:inline-block}
.chip:hover{border-color:var(--faint)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip.add{border-style:dashed;color:var(--muted)}
.inline-add{display:flex;gap:6px;align-items:center;margin-top:8px;padding:8px;background:var(--surface2);border-radius:var(--radius);flex-wrap:wrap}
.inline-add input[type=text]{padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--surface);font-size:12.5px;flex:1;min-width:160px}
.inline-add input[type=color]{width:30px;height:30px;padding:0;border:1px solid var(--line);border-radius:4px;background:none}

.ptable{width:100%;border-collapse:collapse;font-size:12px}
.ptable th{text-align:left;font-weight:500;color:var(--muted);font-size:11px;padding:0 4px 4px;white-space:nowrap}
.ptable td{padding:2px 4px;vertical-align:middle}
.ptable input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--surface);font-size:12px}
.ptable .ro{padding:6px 8px;background:var(--surface2);border-radius:4px;text-align:right;color:var(--muted)}
.ptable .rm{border:0;background:none;color:var(--faint);font-size:16px;line-height:1;padding:2px 6px}
.ptable .rm:hover{color:var(--danger)}

/* 상품 라인 편집 */
.subh{font-size:12px;font-weight:500;color:var(--text);margin:4px 0 8px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.subh .hint{font-size:11px;color:var(--faint);font-weight:400}
.line{border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;margin-bottom:8px;background:var(--surface)}
.line.gift{background:var(--surface2)}
.lrow{display:flex;gap:6px;align-items:center}
.lrow .lsel{flex:0 0 300px;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--surface);font-size:12px}
.lrow .lname{flex:1;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--surface);font-size:12.5px;font-weight:500}
.lrow .rm{border:0;background:none;color:var(--faint);font-size:18px;line-height:1;padding:0 6px}
.lrow .rm:hover{color:var(--danger)}
.lkind{font-size:10.5px;padding:2px 7px;border-radius:3px;background:var(--accent-soft);color:var(--accent);font-weight:500;white-space:nowrap}
.lkind.set{background:#EDE9FE;color:#5B21B6}
.lkind.event{background:var(--warn-bg);color:var(--warn)}
.lrow2{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.lrow2 label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);flex:1;min-width:110px}
.lrow2 input,.lrow2 select{padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--surface);font-size:12px;width:100%;min-width:0}
.lrow2 .dsc{display:flex;gap:4px}
.lrow2 .dsc select{flex:0 0 96px}
.lrow2 .dsc input{flex:1;min-width:72px}
.lrow2 label.wide{flex:1.4;min-width:190px}
.lcalc{display:flex;flex-direction:column;justify-content:center;padding:4px 8px;background:var(--accent-soft);border-radius:4px;min-height:32px}
.calc-sale{font-size:13.5px;font-weight:500;color:var(--accent)}
.calc-disc{font-size:11px;color:var(--muted)}
.lcomp{margin-top:8px;padding:8px 10px;background:var(--surface2);border-radius:4px}
.crow{display:flex;gap:6px;align-items:center;margin-bottom:4px}
.crow select{flex:1;min-width:0;padding:5px 8px;border:1px solid var(--line);border-radius:4px;background:var(--surface);font-size:12px}
.crow input{width:70px;padding:5px 8px;border:1px solid var(--line);border-radius:4px;background:var(--surface);font-size:12px}
.crow .rm{border:0;background:none;color:var(--faint);font-size:16px;padding:0 6px}
.crow .rm:hover{color:var(--danger)}
.pm-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:900px){.pm-grid{grid-template-columns:1fr}}
.pm-list{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:var(--radius)}
.pm-list .pi{display:flex;gap:8px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line2);cursor:pointer;font-size:12.5px}
.pm-list .pi:hover{background:var(--surface2)}
.pm-list .pi.on{background:var(--accent-soft)}
.pm-list .pi.off{opacity:.5}
.pm-list .pi .pn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pm-list .pi .pp{color:var(--muted);white-space:nowrap}
.pm-list .cat{padding:5px 10px;background:var(--surface2);font-size:11px;color:var(--muted);font-weight:500;position:sticky;top:0}
.preview-box{padding:10px 12px;background:var(--accent-soft);border-radius:var(--radius);display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.preview-box b{font-size:15px;color:var(--accent)}
.imp-item{border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px}
.imp-item .warn{color:var(--warn);font-size:11.5px}
.imp-item .ok{color:var(--ok);font-size:11.5px}
.cl{display:flex;flex-direction:column;gap:4px}
.cl label{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:4px;font-size:12.5px;cursor:pointer}
.cl label:hover{background:var(--surface2)}

.cl label .x{margin-left:auto;border:0;background:none;color:var(--faint);padding:0 4px}
.cl label .x:hover{color:var(--danger)}
.prog{height:6px;background:var(--line2);border-radius:3px;overflow:hidden;margin:6px 0 8px}
.prog i{display:block;height:100%;background:var(--accent);width:0}

.links li,.files li{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 0}
.links,.files{list-style:none;margin:0;padding:0}
.files img{width:44px;height:44px;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
.files .fn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.files .fs{color:var(--faint);font-size:11px}

/* detail view */
.dv .kv{display:grid;grid-template-columns:130px 1fr;gap:6px 14px;font-size:12.5px}
.dv .kv dt{color:var(--muted)}
.dv .kv dd{margin:0;white-space:pre-wrap}
.dv .actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.dv .move select{padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--surface);font-size:12.5px}

.confirm{display:inline-flex;gap:6px;align-items:center;padding:6px 10px;background:var(--danger-bg);border-radius:var(--radius);font-size:12px;color:var(--danger)}

/* settings */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:6px 0 14px}
.tabs button{border:0;background:none;padding:8px 12px;font-size:12.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
.stable{width:100%;border-collapse:collapse;font-size:12.5px}
.stable th{text-align:left;font-weight:500;color:var(--muted);font-size:11.5px;padding:6px 6px;border-bottom:1px solid var(--line)}
.stable td{padding:5px 6px;border-bottom:1px solid var(--line2);vertical-align:middle}
.stable input[type=text]{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--surface);font-size:12.5px}
.stable input[type=color]{width:28px;height:28px;padding:0;border:1px solid var(--line);border-radius:4px;background:none;vertical-align:middle}
.stable tr.off td{opacity:.55}
.stable .ord{display:inline-flex;gap:2px}
.stable .ord button{border:1px solid var(--line);background:var(--surface);border-radius:3px;width:22px;height:22px;font-size:11px;padding:0}
.stable .cnt{color:var(--muted);text-align:center}
.switch{position:relative;width:32px;height:18px;border-radius:9px;background:var(--line);border:0;padding:0;transition:background .12s}

.switch.on{background:var(--accent)}
.switch.on::after{left:16px}
.empty{padding:40px;text-align:center;color:var(--muted);font-size:13px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:12.5px;z-index:200;box-shadow:var(--shadow);opacity:0;transition:opacity .15s;pointer-events:none}
.toast.show{opacity:1}
textarea.export{width:100%;min-height:220px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;padding:8px;border:1px solid var(--line);border-radius:4px;background:var(--surface2)}
.datalist-hide{display:none}
</style>

const num = (v)=> { const n = parseFloat(String(v==null?'':v).replace(/[^0-9.\-]/g,'')); return isFinite(n)?n:0; };
const fmt = (n)=> (Math.round(num(n))).toLocaleString('ko-KR');
const won = (n)=> fmt(n)+'원';
const manwon = (n)=> { n = num(n); if(!n) return '0원'; if(Math.abs(n) >= 1e8) return (Math.round(n/1e6)/100).toLocaleString('ko-KR')+'억원'; if(Math.abs(n) >= 1e4) return Math.round(n/1e4).toLocaleString('ko-KR')+'만원'; return won(n); };
const pad2 = (n)=> String(n).padStart(2,'0');
const toISO = (d)=> d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const parseISO = (s)=> { if(!s) return null; const [y,m,d] = s.split('-').map(Number); if(!y||!m||!d) return null; return new Date(y,m-1,d); };
const addDays = (s,n)=> { const d = parseISO(s); d.setDate(d.getDate()+n); return toISO(d); };
const daysBetween = (a,b)=> { const A=parseISO(a),B=parseISO(b); if(!A||!B) return 0; return Math.round((B-A)/86400000); };
const shortDate = (s)=> { const d = parseISO(s); return d ? (d.getMonth()+1)+'.'+d.getDate() : ''; };
const todayISO = ()=> toISO(new Date());
const debounce = (fn,ms)=> { let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; };
const clone = (o)=> JSON.parse(JSON.stringify(o));

/* ---------------- 주차 모델 ----------------
   각 월을 1~7일, 8~14일, 15~21일, 22~28일, 29일~말일의 5주차로 고정합니다. */
const WEEKS = [];
MONTHS.forEach((m,mi)=>{
  const last = new Date(YEAR,m,0).getDate();
  for(let w=0;w<5;w++){
    const sd = 1+w*7, ed = w<4 ? sd+6 : last;
    WEEKS.push({idx:mi*5+w, month:m, week:w+1, start:`${YEAR}-${pad2(m)}-${pad2(sd)}`, end:`${YEAR}-${pad2(m)}-${pad2(ed)}`, label:`${w+1}주차`, range:`${m}.${sd}~${m}.${ed}`});
  }
});
function weekIndexOf(iso){
  const d = parseISO(iso); if(!d) return null;
  const key = d.getFullYear()*100 + (d.getMonth()+1);
  if(key < YEAR*100+MONTHS[0]) return -1;
  if(key > YEAR*100+MONTHS[MONTHS.length-1]) return WEEKS.length;
  const mi = MONTHS.indexOf(d.getMonth()+1);
  return mi*5 + Math.min(4, Math.floor((d.getDate()-1)/7));
}
function spanOf(p){ // 표시 구간 (그리드 범위로 클램프)
  let a = weekIndexOf(p.start), b = weekIndexOf(p.end);
  if(a==null||b==null) return null;
  if(b < 0 || a >= WEEKS.length) return null; // 완전히 범위 밖
  a = Math.max(0,a); b = Math.min(WEEKS.length-1,b); if(b<a) b=a;
  return {a,b};
}
function weekLabel(iso){ const i = weekIndexOf(iso); if(i==null||i<0||i>=WEEKS.length) return '범위 밖'; const w = WEEKS[i]; return `${w.month}월 ${w.week}주차`; }

class LocalStore {
  constructor(){ this.key='lifemeal-md-board-v1'; this.kind='local'; this.data=null; this.listeners=[]; }
  async init(){
    try{ this.data = JSON.parse(localStorage.getItem(this.key)||'null'); }catch(e){ this.data=null; }
    if(!this.data){ this.data = {channels:{},criteria:{},purposes:{},checklist:{},products:{},promotions:{}}; this._seedDefaults(); this._flush(); }
    if(!this.data.products){ this.data.products={}; DEFAULT_PRODUCTS.forEach(c=>this.data.products[c.id]=c); this._flush(); }
    return this._snapshot();
  }
  _seedDefaults(){
    DEFAULT_CHANNELS.forEach(c=>this.data.channels[c.id]=c);
    DEFAULT_CRITERIA.forEach(c=>this.data.criteria[c.id]=c);
    DEFAULT_PURPOSES.forEach(c=>this.data.purposes[c.id]=c);
    DEFAULT_CHECKLIST.forEach(c=>this.data.checklist[c.id]=c);
    DEFAULT_PRODUCTS.forEach(c=>this.data.products[c.id]=c);
  }
  _flush(){ try{ localStorage.setItem(this.key, JSON.stringify(this.data)); }catch(e){ console.warn('localStorage 저장 실패', e); toast('저장 공간이 부족합니다. 첨부 파일을 줄여 주세요.'); } }
  _snapshot(){ const s={}; COLLECTIONS.forEach(c=> s[c]=Object.values(this.data[c]||{})); return s; }
  subscribe(fn){ this.listeners.push(fn); }
  _emit(){ const s=this._snapshot(); this.listeners.forEach(fn=>fn(s)); }
  async put(coll, doc){ this.data[coll][doc.id]=clone(doc); this._flush(); this._emit(); }
  async remove(coll, id){ delete this.data[coll][id]; this._flush(); this._emit(); }
  async replaceAll(snapshot){ COLLECTIONS.forEach(c=>{ this.data[c]={}; (snapshot[c]||[]).forEach(d=>this.data[c][d.id]=d); }); this._flush(); this._emit(); }
}

class DbStore {
  constructor(db){ this.db=db; this.kind='db'; this.cache={}; this.listeners=[]; this.ready={}; }
  async init(){
    // 최초 1회: 기본 채널·기준·목적·체크리스트 시드 (서버 확정 읽기 기준)
    const meta = await this.db.doc('meta/init').get();
    if(!meta.exists){
      const writes=[];
      DEFAULT_CHANNELS.forEach(c=>writes.push(this.db.doc('channels/'+c.id).set(c)));
      DEFAULT_CRITERIA.forEach(c=>writes.push(this.db.doc('criteria/'+c.id).set(c)));
      DEFAULT_PURPOSES.forEach(c=>writes.push(this.db.doc('purposes/'+c.id).set(c)));
      DEFAULT_CHECKLIST.forEach(c=>writes.push(this.db.doc('checklist/'+c.id).set(c)));
      DEFAULT_PRODUCTS.forEach(c=>writes.push(this.db.doc('products/'+c.id).set(c)));
      await Promise.all(writes);
      await this.db.doc('meta/init').set({seededAt:new Date().toISOString(), version:2, products:true});
    } else if(!(meta.data()||{}).products){
      // v1에서 올라온 저장소: 상품 마스터만 추가 시드
      await Promise.all(DEFAULT_PRODUCTS.map(c=>this.db.doc('products/'+c.id).set(c)));
      await this.db.doc('meta/init').update({products:true, version:2});
    }
    // 첫 스냅샷을 모두 받은 뒤 resolve
    await Promise.all(COLLECTIONS.map(c=> new Promise((res)=>{
      let first=true;
      this.db.collection(c).onSnapshot(snap=>{
        this.cache[c] = snap.docs.filter(d=>d.exists).map(d=>Object.assign({id:d.id}, d.data()));
        if(first){ first=false; res(); } else this._emit();
      }, err=>{ console.warn('db snapshot error', c, err); toast('공유 DB 연결이 끊겼습니다. 새로고침해 주세요.'); if(first){first=false;res();} });
    })));
    return this._snapshot();
  }
  _snapshot(){ const s={}; COLLECTIONS.forEach(c=> s[c]=(this.cache[c]||[]).map(clone)); return s; }
  subscribe(fn){ this.listeners.push(fn); }
  _emit(){ const s=this._snapshot(); this.listeners.forEach(fn=>fn(s)); }
  async put(coll, doc){
    // 낙관적 반영 후 서버 기록
    const list = this.cache[coll] || (this.cache[coll]=[]);
    const i = list.findIndex(d=>d.id===doc.id); if(i>=0) list[i]=clone(doc); else list.push(clone(doc));
    this._emit();
    try{ await this.db.doc(coll+'/'+doc.id).set(clone(doc)); }
    catch(e){ console.warn('db set 실패', e); toast(e && e.code==='quota_exceeded' ? '저장 한도에 도달했습니다. 오래된 기획전을 삭제해 주세요.' : e && e.code==='invalid_argument' ? '저장 실패: 첨부 파일이 너무 큽니다(문서 256KB 제한).' : '저장에 실패했습니다. 잠시 후 다시 시도해 주세요.'); }
  }
  async remove(coll, id){
    this.cache[coll] = (this.cache[coll]||[]).filter(d=>d.id!==id); this._emit();
    try{ await this.db.doc(coll+'/'+id).delete(); }catch(e){ console.warn('db delete 실패', e); toast('삭제에 실패했습니다.'); }
  }
  async replaceAll(snapshot){
    // 가져오기: 기존 문서 삭제 후 새 문서 기록
    for(const c of COLLECTIONS){
      const cur = this.cache[c]||[];
      await Promise.all(cur.map(d=>this.db.doc(c+'/'+d.id).delete().catch(()=>{})));
      await Promise.all((snapshot[c]||[]).map(d=>this.db.doc(c+'/'+d.id).set(clone(d)).catch(()=>{})));
      this.cache[c] = (snapshot[c]||[]).map(clone);
    }
    this._emit();
  }
}

class FirebaseStore {
  /* Firebase Realtime Database (라이프밀 팀 대시보드와 같은 프로젝트, 경로 /mdboard).
     GitHub Pages 배포본에서 사용. 페이지에 firebase compat SDK와 window.MDBOARD_FIREBASE 설정이 있을 때만 선택됩니다. */
  constructor(fb, path){ this.kind='firebase'; this.path=path; this.db=fb.database(); this.cache={}; this.listeners=[]; }
  async init(){
    const meta = (await this.db.ref(this.path+'/meta/init').once('value')).val();
    if(!meta){
      const up={};
      DEFAULT_CHANNELS.forEach(c=>up['channels/'+c.id]=c); DEFAULT_CRITERIA.forEach(c=>up['criteria/'+c.id]=c); DEFAULT_PURPOSES.forEach(c=>up['purposes/'+c.id]=c); DEFAULT_CHECKLIST.forEach(c=>up['checklist/'+c.id]=c); DEFAULT_PRODUCTS.forEach(c=>up['products/'+c.id]=c);
      up['meta/init']={seededAt:new Date().toISOString(), version:2, products:true};
      await this.db.ref(this.path).update(up);
    } else if(!meta.products){
      const up={}; DEFAULT_PRODUCTS.forEach(c=>up['products/'+c.id]=c); up['meta/init/products']=true; await this.db.ref(this.path).update(up);
    }
    await Promise.all(COLLECTIONS.map(c=> new Promise((res)=>{
      let first=true;
      this.db.ref(this.path+'/'+c).on('value', snap=>{
        const v = snap.val()||{}; this.cache[c] = Object.keys(v).map(k=>Object.assign({id:k}, v[k]));
        if(first){ first=false; res(); } else this._emit();
      }, err=>{ console.warn('firebase error', c, err); toast('Firebase 연결에 실패했습니다. 새로고침해 주세요.'); if(first){first=false;res();} });
    })));
    return this._snapshot();
  }
  _snapshot(){ const s={}; COLLECTIONS.forEach(c=> s[c]=(this.cache[c]||[]).map(clone)); return s; }
  subscribe(fn){ this.listeners.push(fn); }
  _emit(){ const s=this._snapshot(); this.listeners.forEach(fn=>fn(s)); }
  async put(coll, doc){
    const list = this.cache[coll] || (this.cache[coll]=[]);
    const i = list.findIndex(d=>d.id===doc.id); if(i>=0) list[i]=clone(doc); else list.push(clone(doc));
    this._emit();
    try{ await this.db.ref(this.path+'/'+coll+'/'+doc.id).set(clone(doc)); }
    catch(e){ console.warn('firebase set 실패', e); toast('저장에 실패했습니다 (Firebase 권한 또는 네트워크). 잠시 후 다시 시도해 주세요.'); }
  }
  async remove(coll, id){
    this.cache[coll] = (this.cache[coll]||[]).filter(d=>d.id!==id); this._emit();
    try{ await this.db.ref(this.path+'/'+coll+'/'+id).remove(); }catch(e){ console.warn('firebase remove 실패', e); toast('삭제에 실패했습니다.'); }
  }
  async replaceAll(snapshot){
    const up={}; COLLECTIONS.forEach(c=>{ up[c]={}; (snapshot[c]||[]).forEach(d=>up[c][d.id]=clone(d)); this.cache[c]=(snapshot[c]||[]).map(clone); });
    await this.db.ref(this.path).update(up); this._emit();
  }
}

/* ---------------- 앱 상태 ---------------- */
const S = { store:null, channels:[], criteria:[], purposes:[], checklist:[], products:[], promotions:[], view:'gantt', mode:'report',
  filters:{month:'',channel:'',criteria:'',purpose:'',status:'',owner:'',q:'',archived:false,inactiveCh:false} };
const byId = (list,id)=> list.find(x=>x.id===id);
const sorted = (list)=> list.slice().sort((a,b)=>(a.order??0)-(b.order??0));
const activeSorted = (list)=> sorted(list).filter(x=>x.active!==false);

function applySnapshot(snap){
  S.channels = snap.channels||[]; S.criteria = snap.criteria||[]; S.purposes = snap.purposes||[]; S.checklist = snap.checklist||[]; S.products = snap.products||[]; S.promotions = snap.promotions||[];
  renderAll();
}

/* ---------------- 상품 마스터 계산 ---------------- */
const PRODUCT_TYPES = {single:'일반 상품', set:'세트 상품', event:'이벤트 · 사은품'};
function productById(id){ return byId(S.products, id); }
function componentsSum(components){ // 구성품 정상 단가 합계
  return (components||[]).reduce((s,c)=>{ const pr=productById(c.productId); return s + (pr?num(masterPrice(pr)):num(c.price))*num(c.qty||1); },0);
}
function masterPrice(p){ // 상품 마스터의 정상 단가 (세트 auto면 구성품 합계)
  if(!p) return 0;
  if(p.type==='set' && p.priceMode==='auto') return componentsSum(p.components);
  return num(p.price);
}
function compText(components){ return (components||[]).map(c=>{ const pr=productById(c.productId); return (pr?pr.name:(c.name||'?'))+' x '+num(c.qty||1); }).join(' + '); }
const round10 = (n)=> Math.round(n/10)*10;
function lineSalePrice(it){ // 행사가 계산: discType pct(할인율) / amt(할인액) / price(행사가 직접)
  const base = num(it.price);
  if(it.discType==='pct') return round10(base*(1-num(it.discVal)/100));
  if(it.discType==='amt') return Math.max(0, base-num(it.discVal));
  return it.salePrice===''||it.salePrice==null ? base : num(it.salePrice);
}
function lineDiscPct(it){ const a=num(it.price), s=lineSalePrice(it); return a>0 && s<=a ? Math.round((1-s/a)*100) : null; }
function normalizeLine(x){ // 예전 구조(name/comp/price/salePrice) 호환
  const it = Object.assign({id:uid('li'),kind:'single',productId:'',name:'',comp:'',components:[],price:'',discType:'price',discVal:'',salePrice:'',stock:'',qty:'',cost:'',cond:''}, x||{});
  if(!x || !x.kind){ it.kind = (x&&x.components&&x.components.length)?'set':'single'; if(x && x.salePrice!==undefined && !x.discType) it.discType='price'; }
  return it;
}
function saleLines(p){ return (p.products||[]).map(normalizeLine).filter(l=>l.kind!=='event'); }
function giftLines(p){ return (p.products||[]).map(normalizeLine).filter(l=>l.kind==='event'); }

/* ---------------- 계산 ---------------- */
function budgetOf(p){
  const g = p.goal||{};
  const total = ['ad','discount','giftCost','prod','fee','logistics','etc'].reduce((s,k)=>s+num(g[k]),0);
  const sales = num(g.sales);
  return { total, sales, remain: sales-total, roas: total>0 ? sales/total : null };
}
function checklistProgress(p){ const l=p.checklist||[]; if(!l.length) return null; const d=l.filter(c=>c.done).length; return {done:d,total:l.length,pct:Math.round(d/l.length*100)}; }
function countsPerWeek(){ // 전체 채널 기준 주차별 동시 진행 수 (보관·취소 제외)
  const c = new Array(WEEKS.length).fill(0);
  S.promotions.forEach(p=>{ if(p.archived||p.status==='취소') return; const sp=spanOf(p); if(!sp) return; for(let i=sp.a;i<=sp.b;i++) c[i]++; });
  return c;
}
function isVisible(p){
  const f = S.filters;
  if(!f.archived && p.archived) return false;
  if(f.channel && p.channelId!==f.channel) return false;
  if(f.status && p.status!==f.status) return false;
  if(f.owner && (p.owner||'')!==f.owner) return false;
  if(f.criteria && !(p.criteriaIds||[]).includes(f.criteria)) return false;
  if(f.purpose && !(p.purposeIds||[]).includes(f.purpose)) return false;
  if(f.month){ const sp=spanOf(p); if(!sp) return false; const m=Number(f.month); let hit=false; for(let i=sp.a;i<=sp.b;i++) if(WEEKS[i].month===m) hit=true; if(!hit) return false; }
  if(f.q){ const q=f.q.toLowerCase(); const hay=[p.name,p.memo,p.benefit,p.target,p.gift,p.coupon,p.owner,...(p.products||[]).map(x=>(x.name||'')+' '+(x.comp||''))].join(' ').toLowerCase(); if(!hay.includes(q)) return false; }
  return true;
}
function assignLanes(list){ // 겹치지 않게 행(레인) 배정
  const lanes=[]; const out=[];
  list.slice().sort((a,b)=> a._sp.a-b._sp.a || (b._sp.b-b._sp.a)-(a._sp.b-a._sp.a) || (a.name||'').localeCompare(b.name||'')).forEach(p=>{
    let l=0; while(lanes[l]!=null && lanes[l] >= p._sp.a) l++;
    lanes[l]=p._sp.b; out.push(Object.assign({}, p, {_lane:l}));
  });
  return {items:out, lanes:Math.max(1,lanes.length)};
}

    <div class="tile"><div class="lab">검토 중</div><div class="val num">${live.filter(p=>p.status==='검토 중').length}<small>건</small></div><div class="note">아이디어 ${live.filter(p=>p.status==='아이디어').length}건 · 기획 중 ${live.filter(p=>p.status==='기획 중').length}건</div></div>
    <div class="tile ${overWeeks?'warn':''}"><div class="lab">동시 ${CONCURRENT_MAX}건 최대치 초과 주차</div><div class="val num">${overWeeks}<small>주차</small></div><div class="note">최대치 도달 ${fullWeeks}주차 · 전 채널 합산 · 취소 제외</div></div>
    <div class="mtable"><table class="num"><thead><tr><th>월별 (시작일 기준)</th>${perMonth.map(x=>`<th>${x.m}월</th>`).join('')}<th>합계</th></tr></thead>
      <tbody>

      <tr><td>목표 매출</td>${perMonth.map(x=>`<td>${manwon(x.sales)}</td>`).join('')}<td>${manwon(tot.sales)}</td></tr>
      <tr class="tot"><td>예상 ROAS</td>${perMonth.map(x=>`<td>${x.budget>0?(x.sales/x.budget).toFixed(1)+'배':'-'}</td>`).join('')}<td>${tot.budget>0?(tot.sales/tot.budget).toFixed(1)+'배':'-'}</td></tr>
      </tbody></table></div>`;
}

function fillSelect(sel, items, cur, labelFn){
  const keep = sel.firstElementChild.outerHTML;
  sel.innerHTML = keep + items.map(it=>`<option value="${esc(it.value)}">${esc(it.label)}</option>`).join('');
  sel.value = cur; if(sel.value!==cur) sel.value='';
}
function renderFilterOptions(){

/* ---------------- 렌더: 캘린더 ---------------- */
function statusPill(st){ const c=STATUS_STYLE[st]||STATUS_STYLE['아이디어']; return `<span class="st" style="background:${c[0]};color:${c[1]}">${esc(st||'-')}</span>`; }
function critTags(p, max){
  const cs = (p.criteriaIds||[]).map(id=>byId(S.criteria,id)).filter(Boolean);
  const shown = cs.slice(0,max), rest = cs.length-shown.length;
  return shown.map(c=>`<span class="tag" style="--tc:${c.color}" title="${esc(c.name)}">${esc(c.name)}</span>`).join('') + (rest>0?`<span class="tag more">+${rest}</span>`:'');
}
function cardColor(p){ const c=(p.criteriaIds||[]).map(id=>byId(S.criteria,id)).filter(Boolean)[0]; return c?c.color:'var(--faint)'; }

function renderCalendar(){
  const counts = countsPerWeek();
  const today = todayISO();
  const chans = sorted(S.channels).filter(c=> S.filters.inactiveCh || c.active!==false);
  const promosByCh = {};
  S.promotions.forEach(p=>{ if(!isVisible(p)) return; const sp=spanOf(p); if(!sp) return; (promosByCh[p.channelId] = promosByCh[p.channelId]||[]).push(Object.assign({},p,{_sp:sp})); });

  let h = '';
  // 월 헤더
  h += `<div class="row hd months"><div class="cell sticky c1 corner">판매 채널</div><div class="cell sticky c2 corner">채널 성격 · 운영 역할</div>`;
  MONTHS.forEach(m=>{ const n = S.promotions.filter(p=>!p.archived && p.status!=='취소' && parseISO(p.start) && parseISO(p.start).getMonth()+1===m && parseISO(p.start).getFullYear()===YEAR).length; h += `<div class="mcell cell"><span>${YEAR}년 ${m}월</span><span class="mb">${n}건 시작</span></div>`; });
  h += `</div>`;

  WEEKS.forEach(w=>{ const over = counts[w.idx]>=CONCURRENT_LIMIT; const full = counts[w.idx]===CONCURRENT_MAX; const isToday = today>=w.start && today<=w.end;

  h += `</div>`;

  if(!chans.length) h += `<div class="empty">표시할 채널이 없습니다. 설정에서 채널을 추가하거나 활성화해 주세요.</div>`;
  chans.forEach(ch=>{
    const {items,lanes} = assignLanes(promosByCh[ch.id]||[]);
    h += `<div class="row chrow ${ch.active===false?'inactive':''}" data-ch="${ch.id}" style="grid-template-rows:repeat(${lanes},minmax(0,auto))">`;
    h += `<div class="cell sticky c1 chn" data-edit="name" data-ch="${ch.id}" title="클릭하여 채널명 수정"><span class="name">${esc(ch.name)}${ch.active===false?' <span class="meta">(비활성)</span>':''}</span><span class="meta">${(promosByCh[ch.id]||[]).length}건</span></div>`;
    h += `<div class="cell sticky c2 chd" data-edit="desc" data-ch="${ch.id}" title="클릭하여 채널 성격 수정">${esc(ch.desc||'')||'<span class="meta">채널 성격을 입력하세요</span>'}</div>`;
    WEEKS.forEach(w=>{ h += `<div class="slot ${w.week===1?'mstart':''} ${counts[w.idx]>=CONCURRENT_LIMIT?'over':(counts[w.idx]===CONCURRENT_MAX?'full':'')}" data-ch="${ch.id}" data-w="${w.idx}" style="grid-column:${3+w.idx};grid-row:1 / span ${lanes}"><button type="button" class="addbtn" data-add="1">+ 등록</button></div>`; });

function cardHTML(p, counts){
  const b = budgetOf(p); const pr = checklistProgress(p);
  const pur = (p.purposeIds||[]).map(id=>(byId(S.purposes,id)||{}).name).filter(Boolean).join(', ');
  const prod = saleLines(p).filter(x=>x.name); const prodTxt = prod.length ? prod[0].name + (prod.length>1?` 외 ${prod.length-1}`:'') : '';
  let over=false; for(let i=p._sp.a;i<=p._sp.b;i++) if(counts[i]>=CONCURRENT_LIMIT) over=true;
  const days = daysBetween(p.start,p.end)+1;
  const ddl = p.deadline && p.status!=='완료' && p.status!=='취소' && p.deadline < todayISO();
  return `<div class="card ${p.archived?'archived':''}" draggable="true" data-id="${p.id}" style="--cc:${cardColor(p)};grid-column:${3+p._sp.a} / span ${p._sp.b-p._sp.a+1};grid-row:${p._lane+1}" title="${esc(p.name)}">
    <div class="top"><div class="tags">${critTags(p,2)||'<span class="tag more">기준 없음</span>'}</div>${over?'<span class="wb" title="동시 진행 기획전이 최대치('+CONCURRENT_MAX+'건)를 넘었습니다">!</span>':''}${statusPill(p.status)}</div>
    <div class="nm">${esc(p.name)||'(이름 없음)'}</div>
    <div class="ln"><span>${shortDate(p.start)} ~ ${shortDate(p.end)} (${days}일)</span>${p.owner?`<b>·</b><span>${esc(p.owner)}</span>`:''}</div>
    <div class="ln"><b>목적</b><span>${esc(pur)||'-'}</span></div>
    <div class="ln"><b>상품</b><span>${esc(prodTxt)||'-'}</span></div>
    <div class="ln"><b>혜택</b><span>${esc(p.benefit)||'-'}</span></div>
    <div class="bt"><span class="bud num">예산 ${manwon(b.total)}</span><span class="pr num">${pr?`체크 ${pr.done}/${pr.total}`:''}${ddl?' <span class="ddl">마감 지남</span>':''}</span></div>
  </div>`;
}

/* ---------------- 렌더: 메인 계획표 (주차 x 채널, 기획전 + 판매 상품) ---------------- */
const REPORT_GROUP = { '기획 중':'fix','제작 중':'fix','세팅 중':'fix','진행 예정':'fix','진행 중':'live','완료':'done','아이디어':'draft','검토 중':'draft','보류':'draft' };
const REPORT_LABEL = { fix:'확정', live:'진행 중', done:'완료', draft:'초안' };
const CORE_CHANNELS = ['ch_naver','ch_own','ch_talkdeal','ch_toss'];
const shortProd = (s)=> String(s||'').replace(/^황성주 박사의\s*/,'').replace(/^라이프밀\s*/,'');
function reportProduct(p, max){ max=max||3; const ls=saleLines(p).map(l=>shortProd(l.name)).filter(Boolean); const g=giftLines(p).map(l=>shortProd(l.name)).filter(Boolean); let s=ls.slice(0,max).join(', '); if(ls.length>max) s+=` 외 ${ls.length-max}종`; if(g.length) s += (s?' / ':'') + '사은품: ' + g.slice(0,2).join(', '); return s; }
function renderReport(){
  const counts = countsPerWeek();
  const rows = S.promotions.filter(p=>!p.archived && p.status!=='취소').map(p=>Object.assign({},p,{_sp:spanOf(p)})).filter(p=>p._sp);
  const chans = sorted(S.channels).filter(c=> c.active!==false && (CORE_CHANNELS.includes(c.id) || rows.some(p=>p.channelId===c.id)));
  const n = {fix:0,live:0,done:0,draft:0}; rows.forEach(p=>{ n[REPORT_GROUP[p.status]||'draft']++; });
  const md = (s)=> s ? `${Number(s.slice(5,7))}/${Number(s.slice(8,10))}` : '';
  const mFilter = Number(S.rpMonth||0);
  const vis = WEEKS.filter(w=>!mFilter || w.month===mFilter); const wa=vis[0].idx, wb=vis[vis.length-1].idx;
  const months = []; vis.forEach(w=>{ const m=months[months.length-1]; if(m && m.month===w.month) m.n++; else months.push({month:w.month, n:1}); });
  let h = `<div class="rp-head"><div><h2>라이프밀 프로모션 계획 ${YEAR}년 9~12월</h2><div class="sub">채널별 · 주차별로 어떤 기획전을 어떤 상품으로 진행하는지 · 기준일 ${todayISO()}</div></div>
    <div class="lg"><span><i style="background:#E9F7EE;border-color:#16A34A"></i>진행 중 ${n.live}</span><span><i style="background:#FFF4E2;border-color:#F59E0B"></i>확정 ${n.fix}</span><span><i style="background:#fff;border:1px dashed #AAB3C0"></i>초안 ${n.draft}</span>${n.done?`<span><i style="background:#F1F3F6;border-color:#9CA3AF"></i>완료 ${n.done}</span>`:''}</div>
    <div class="mtabs">${[[0,'전체'],[9,'9월'],[10,'10월'],[11,'11월'],[12,'12월']].map(([m,l])=>`<button type="button" data-m="${m}" class="${m===mFilter?'on':''}">${l}</button>`).join('')}</div>
    <div class="acts"><button type="button" class="btn sm primary" id="rpAdd">+ 기획전 추가</button><button type="button" class="btn sm" id="rpImg">이미지로 저장</button><button type="button" class="btn sm" id="rpPrint">인쇄 · PDF</button></div></div>`;
  h += `<div class="rp-scroll"><table class="wtable ${mFilter?'fit':''}" style="width:${mFilter?'100%':(160+170*vis.length)+'px'}"><colgroup><col class="cch">${vis.map(()=>'<col class="cwk">').join('')}</colgroup><thead><tr class="hm"><th class="chc" rowspan="2">채널</th>`;
  months.forEach(m=>{ const mn = rows.filter(p=>WEEKS[p._sp.a].month===m.month).length; h += `<th colspan="${m.n}" class="ms">${YEAR}년 ${m.month}월<span class="d">이달 시작 기획전 ${mn}건</span></th>`; });
  h += `</tr><tr class="hw">`;
  vis.forEach(w=>{ h += `<th class="wk ${w.week===1?'ms':''}">${w.month}월 ${w.week}주<span class="d">${w.range.replace('~',' ~ ')}</span></th>`; });
  h += `</tr></thead><tbody>`;
  const box = (x)=>{ const p=x.p; const g=REPORT_GROUP[p.status]||'draft'; const pd=reportProduct(p); const cutL=p._sp.a<x.a, cutR=p._sp.b>x.b;
    return `<div class="pb ${g} ${cutL?'cutL':''} ${cutR?'cutR':''} ${x.b===x.a?'n1':''}" data-id="${p.id}" title="${esc(p.name)}${p.benefit?' · '+esc(p.benefit):''}"><div class="nm"><span class="t">${cutL?'◀ ':''}${esc(p.name)}</span><span class="tag">${REPORT_LABEL[g]}</span><span class="rg">${md(p.start)}~${md(p.end)}${cutR?' ▶':''}</span></div>${p.theme?`<div class="th">${esc(p.theme)}</div>`:''}${pd?`<div class="pd">${esc(pd)}</div>`:'<div class="pd" style="color:var(--faint)">상품 미정</div>'}${p.benefit?`<div class="bf">${esc(p.benefit)}</div>`:''}</div>`; };
  chans.forEach(c=>{
    const all = rows.filter(p=>p.channelId===c.id);
    const items = all.map(p=>({p, a:Math.max(p._sp.a,wa), b:Math.min(p._sp.b,wb)})).filter(x=>x.b>=x.a).sort((x,y)=>x.a-y.a || y.b-x.b);
    const lanes=[]; items.forEach(x=>{ let L=lanes.find(l=>l.end<x.a); if(!L){ L={end:-1,items:[]}; lanes.push(L); } L.items.push(x); L.end=x.b; });
    if(!lanes.length) lanes.push({end:-1,items:[]});
    lanes.forEach((L,li)=>{
      h += `<tr class="lane ${li===lanes.length-1?'chlast':''}">`;
      if(li===0) h += `<td class="chc" rowspan="${lanes.length}"><span class="w">${esc(c.name)}</span>${c.desc?`<span class="r ds" title="${esc(c.desc)}">${esc(c.desc)}</span>`:''}<span class="r">${mFilter?`${items.length}건 (이달)`:`${all.length}건`}</span></td>`;
      const byStart = new Map(L.items.map(x=>[x.a,x]));
      let w=wa;
      while(w<=wb){ const x=byStart.get(w); const ms = WEEKS[w].week===1?'ms':'';
        if(x){ h += `<td class="bar ${ms}" colspan="${x.b-x.a+1}">${box(x)}</td>`; w=x.b+1; }
        else { h += `<td class="cell ${ms}" data-ch="${c.id}" data-w="${w}"><span class="add">+ 추가</span></td>`; w++; }
      }
      h += `</tr>`;
    });
  });
  h += `<tr class="cnt"><td class="chc">동시 진행<span class="r">주당 최대 ${CONCURRENT_MAX}건 기준</span></td>`;
  vis.forEach(w=>{ const cnt=counts[w.idx]; h += `<td class="${cnt>=CONCURRENT_LIMIT?'over':(cnt===CONCURRENT_MAX?'full':'')} ${w.week===1?'ms':''}">${cnt||''}</td>`; });
  h += `</tr></tbody></table></div>`;
  h += `<div class="rp-note"><span>읽는 법: 한 줄이 한 채널, 한 칸이 한 주입니다. 가로로 이어진 상자가 그 채널에서 진행하는 기획전과 기간이고, 상자 안 아래 줄이 판매 상품입니다. 한 채널에 기획전이 겹치면 줄이 늘어납니다.</span><span>점선 상자(초안)는 9/4 회의 내용으로 잡아 둔 검토안이며 확정 전입니다. 위 월 버튼으로 한 달씩 볼 수 있고, 빈 칸을 누르면 바로 추가, 상자를 누르면 내용 확인·수정.</span></div>`;
  const R = $('#report'); R.innerHTML = h;
  $$('.pb[data-id]',R).forEach(el=>el.addEventListener('click', e=>{ e.stopPropagation(); openDetail(el.dataset.id); }));
  $$('td.cell',R).forEach(td=>td.addEventListener('click', ()=>openQuickForm({channelId:td.dataset.ch, weekIdx:Number(td.dataset.w)})));
  $$('.mtabs button',R).forEach(b=>b.addEventListener('click', ()=>{ S.rpMonth=Number(b.dataset.m); try{ sessionStorage.setItem('mdboard-rpmonth', String(S.rpMonth)); }catch(_){ } renderReport(); }));
  $('#rpAdd',R).addEventListener('click', ()=>openQuickForm({}));
  $('#rpPrint',R).addEventListener('click', ()=>window.print());
  $('#rpImg',R).addEventListener('click', saveReportImage);
}
/* 간단 등록: 기획전명 · 채널 · 주차 · 상품 · 혜택 · 상태만. 나머지는 상세에서 */
function openQuickForm(pre){
  pre=pre||{};
  const E = pre.edit ? normalizePromotion(pre.edit) : null; const esp = E ? spanOf(E) : null;
  const wi = esp ? esp.a : (pre.weekIdx!=null ? pre.weekIdx : Math.max(0, weekIndexOf(todayISO())||0));
  const wb = esp ? esp.b : wi;
  const selIds = new Set(E ? saleLines(E).map(l=>l.productId).filter(x=>x&&x!=='__manual') : []);
  const manualNames = E ? saleLines(E).filter(l=>!l.productId||l.productId==='__manual').map(l=>l.name).filter(Boolean) : [];
  if(E) pre.channelId = E.channelId;
  const prods = activeSorted(S.products).filter(p=>p.type!=='event');
  const cats = Array.from(new Set(prods.map(p=>p.category||'기타')));
  const ov = openModal(`<div class="mh"><div><h2>${E?'기획전 수정':'기획전 추가'}</h2><div class="sub">필요한 것만 적고 저장하세요. 예산·체크리스트 같은 상세는 "자세히"에서 채우면 됩니다.</div></div><span class="spacer"></span><button type="button" class="btn sm ghost" data-close>닫기</button></div>
    <div class="mb qf"><div class="fg" style="margin-top:12px">
      <div class="f s8"><label>기획전명 <span class="req">*</span></label><input type="text" id="qName" value="${esc(E?E.name:'')}" placeholder="예: 빼빼로데이 스틱 기획전" autofocus></div>
      <div class="f s4"><label>채널 <span class="req">*</span></label><select id="qCh">${activeSorted(S.channels).map(c=>`<option value="${c.id}" ${c.id===pre.channelId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
      <div class="f s3"><label>시작 주차</label><select id="qA">${WEEKS.map(w=>`<option value="${w.idx}" ${w.idx===wi?'selected':''}>${w.month}월 ${w.week}주 (${w.range})</option>`).join('')}</select></div>
      <div class="f s3"><label>종료 주차</label><select id="qB">${WEEKS.map(w=>`<option value="${w.idx}" ${w.idx===wb?'selected':''}>${w.month}월 ${w.week}주 (${w.range})</option>`).join('')}</select></div>
      <div class="f s3"><label>상태</label><select id="qSt">${[['검토 중','초안 (검토 중)'],['기획 중','확정 (기획 중)'],['진행 예정','확정 (진행 예정)'],['진행 중','진행 중'],['완료','완료'],['보류','보류'],['취소','취소']].map(([v,l])=>`<option value="${v}" ${E&&E.status===v?'selected':''}>${l}</option>`).join('')}</select></div>
      <div class="f s3"><label>담당자</label><input type="text" id="qOwner" value="${esc(E?E.owner:(pre.owner||''))}" placeholder="이름"></div>
      <div class="f s12"><label>테마 · 키워드 <span class="hint">(한 줄: 예 "환절기 · 아침 루틴 · 면역")</span></label><input type="text" id="qTheme" value="${esc(E?(E.theme||''):'')}" placeholder="이 기획전을 한마디로"></div>
      <div class="f s12"><label>판매 상품 <span class="hint">(여러 개 선택 가능 · 목록에 없으면 아래 직접 입력)</span></label><div class="plist" id="qProds">${cats.map(cat=>`<div class="cat">${esc(cat)}</div>`+prods.filter(p=>(p.category||'기타')===cat).map(p=>`<label><input type="checkbox" value="${p.id}" ${selIds.has(p.id)?'checked':''}> ${esc(p.name)} <span class="note">${fmt(masterPrice(p))}원</span></label>`).join('')).join('')}</div>
        <input type="text" id="qManual" value="${esc(manualNames.join(', '))}" placeholder="직접 입력 상품 (쉼표로 구분)" style="margin-top:6px"></div>
      <div class="f s12"><label>핵심 혜택 한 줄 <span class="hint">(예: 2개 구매 시 15% 할인 + 쿨백 증정)</span></label><input type="text" id="qBenefit" value="${esc(E?E.benefit:'')}"></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:14px;align-items:center"><button type="button" class="btn primary" id="qSave">저장</button><button type="button" class="btn" id="qMore">상세 입력으로 이동</button><span class="err" id="qErr"></span></div></div>`, {narrow:true});
  $('#qA',ov).addEventListener('change', ()=>{ if(Number($('#qB',ov).value) < Number($('#qA',ov).value)) $('#qB',ov).value=$('#qA',ov).value; });
  function build(){
    const name=$('#qName',ov).value.trim(); if(!name){ $('#qErr',ov).textContent='기획전명을 입력하세요'; $('#qName',ov).focus(); return null; }
    const a=Number($('#qA',ov).value), b=Math.max(a, Number($('#qB',ov).value));
    const d = E ? clone(E) : newPromotion({channelId:$('#qCh',ov).value, start:WEEKS[a].start, end:WEEKS[b].end});
    if(E){ d.channelId=$('#qCh',ov).value; if(!esp || a!==esp.a) d.start=WEEKS[a].start; if(!esp || b!==esp.b) d.end=WEEKS[b].end; }
    d.name=name; d.status=$('#qSt',ov).value; d.owner=$('#qOwner',ov).value.trim(); d.benefit=$('#qBenefit',ov).value.trim(); d.theme=$('#qTheme',ov).value.trim();
    const keepGifts = E ? giftLines(E) : [];
    d.products = $$('#qProds input:checked',ov).map(cb=>{ const p=productById(cb.value); const it=normalizeLine({kind:p.type==='set'?'set':'single'}); it.productId=p.id; it.name=p.name; it.price=String(masterPrice(p)); it.comp=p.spec||''; if(p.type==='set'){ it.components=clone(p.components||[]); it.comp=compText(it.components); } it.discType='pct'; return it; });
    $('#qManual',ov).value.split(',').map(s=>s.trim()).filter(Boolean).forEach(nm=>{ const old = E ? saleLines(E).find(l=>(!l.productId||l.productId==='__manual') && l.name===nm) : null; if(old){ d.products.push(clone(old)); return; } const it=normalizeLine({kind:'single'}); it.productId='__manual'; it.name=nm; it.discType='pct'; d.products.push(it); });
    if(E){ d.products = d.products.map(it=>{ const old=saleLines(E).find(l=>l.productId===it.productId && it.productId!=='__manual'); return old?Object.assign(clone(old),{name:it.name}):it; }).concat(keepGifts); }
    return d;
  }
  $('#qSave',ov).addEventListener('click', async ()=>{ const d=build(); if(!d) return; if(!E) d.id=uid('pr'); d.updatedAt=new Date().toISOString(); await S.store.put('promotions', clone(d)); closeModal(ov); toast(E?'저장했습니다':'기획전을 추가했습니다'); });
  $('#qMore',ov).addEventListener('click', ()=>{ const d=build(); if(!d) return; closeModal(ov); openForm(d); });
}
async function saveReportImage(){
  const R = $('#report');
  try{
    if(!window.html2canvas){ await new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
    const acts = $('.rp-head .acts',R); acts.style.visibility='hidden';
    const sc = $('.rp-scroll',R); const tbl=$('.wtable',R); const tw = Math.max(R.clientWidth, (tbl?tbl.scrollWidth:0)+2);
    const prev = {ov:sc.style.overflow, mh:sc.style.maxHeight, w:R.style.width};
    sc.style.overflow='visible'; sc.style.maxHeight='none'; R.style.width=tw+'px';
    let canvas; try{ canvas = await html2canvas(R, {scale:2, backgroundColor:'#ffffff', windowWidth: tw+80, scrollX:0, scrollY:0}); }
    finally{ sc.style.overflow=prev.ov; sc.style.maxHeight=prev.mh; R.style.width=prev.w; acts.style.visibility=''; }
    const a=document.createElement('a'); a.href=canvas.toDataURL('image/png'); a.download=`라이프밀_프로모션계획_${todayISO()}.png`; document.body.appendChild(a); a.click(); a.remove(); toast('이미지를 저장했습니다');
  }catch(e){ console.warn(e); toast('이미지 저장이 막힌 환경입니다. 인쇄 · PDF를 이용해 주세요.'); }
}
function setMode(m){ S.mode=m; document.body.classList.toggle('report', m==='report'); $('#btnMode').textContent = m==='report' ? '작업 화면 열기' : '보고 화면으로'; try{ sessionStorage.setItem('mdboard-mode', m); }catch(_){ } renderAll(); }

/* ---------------- 렌더: 간트 차트 (월·주차 x 채널별 기획전) ---------------- */
const GANTT_STATUS = { // 상태 → 범례 그룹
  '아이디어':'idea','검토 중':'idea','보류':'hold','취소':'hold',
  '기획 중':'plan','제작 중':'plan','세팅 중':'plan','진행 예정':'plan',
  '진행 중':'live','완료':'done'
};
const GANTT_COLORS = { idea:'#F59E0B', plan:'#F59E0B', live:'#16A34A', done:'#6B7280', hold:'#9CA3AF' };
const GANTT_LEGEND = [['plan','계획 확정 (기획·제작·세팅·진행 예정)'],['live','진행 중'],['done','완료'],['idea','아이디어 · 검토 중 (빗금)'],['hold','보류 · 취소']];
function productSummary(p, max){ const ls = saleLines(p); const names = ls.map(l=>l.name).filter(Boolean); const g = giftLines(p).map(l=>l.name).filter(Boolean); let s = names.slice(0,max||2).join(', '); if(names.length>(max||2)) s += ` 외 ${names.length-(max||2)}`; if(g.length) s += (s?' + ':'') + '사은품 ' + g[0] + (g.length>1?` 외 ${g.length-1}`:''); return s || '-'; }
function renderGantt(){
  const counts = countsPerWeek();
  const chans = sorted(S.channels).filter(c=> S.filters.inactiveCh || c.active!==false);
  const rows = S.promotions.filter(isVisible).map(p=>Object.assign({},p,{_sp:spanOf(p)})).filter(p=>p._sp);
  const today = todayISO();
  let h = `<div class="gt-bar"><span class="note">채널별 · 월·주차 간트. 막대 안 글자는 기획전명, 왼쪽 열에 상품 구성. 행을 누르면 상세.</span><span class="spacer"></span><label class="chk"><input type="checkbox" id="gtWide"> 넓게 보기</label><button type="button" class="btn sm" id="gtPrint">인쇄 · PDF 저장</button></div>`;
  h += `<table class="gtable"><thead><tr><th class="lc c1" rowspan="2">채널 / 기간</th><th class="lc c2" rowspan="2">기획전 · 기준</th><th class="lc c3" rowspan="2">상품 구성</th><th class="lc c4" rowspan="2">담당</th>`;
  MONTHS.forEach(m=>{ h += `<th class="mth" colspan="5">${YEAR}년 ${m}월</th>`; });
  h += `</tr><tr>`;
  WEEKS.forEach(w=>{ const over=counts[w.idx]>=CONCURRENT_LIMIT, full=counts[w.idx]===CONCURRENT_MAX; h += `<th class="wk ${w.week===1?'mstart':''} ${over?'over':(full?'full':'')}" title="${w.range}">${w.week}주차<span class="d">${w.range.split('~')[0].split('.')[1]}~${w.range.split('~')[1].split('.')[1]}일</span></th>`; });
  h += `</tr></thead><tbody>`;
  let total=0;
  chans.forEach(ch=>{
    const list = rows.filter(p=>p.channelId===ch.id).sort((a,b)=> a._sp.a-b._sp.a || (a.start||'').localeCompare(b.start||''));
    if(!list.length && (S.filters.channel||S.filters.q||S.filters.status||S.filters.criteria||S.filters.purpose||S.filters.owner||S.filters.month)) return;
    h += `<tr class="chh"><td class="lc c1">${esc(ch.name)}</td><td class="lc c2" style="font-weight:400;color:var(--muted)">${esc(ch.desc||'')}</td><td class="lc c3"></td><td class="lc c4">${list.length}건</td>${WEEKS.map(w=>`<td class="gc ${w.week===1?'mstart':''}"></td>`).join('')}</tr>`;
    if(!list.length){ h += `<tr class="gr"><td class="lc c1"></td><td class="lc c2" style="color:var(--faint);font-weight:400">등록된 기획전 없음</td><td class="lc c3"></td><td class="lc c4"></td>${WEEKS.map(w=>`<td class="gc ${w.week===1?'mstart':''}"></td>`).join('')}</tr>`; return; }
    list.forEach(p=>{
      total++;
      const grp = GANTT_STATUS[p.status]||'plan'; const col = GANTT_COLORS[grp];
      const crit = (p.criteriaIds||[]).map(id=>byId(S.criteria,id)).filter(Boolean).map(c=>c.name).slice(0,2).join(' · ');

    h += `<tr class="clickable" data-id="${p.id}"><td>${wk}</td><td>${esc(ch?ch.name:'-')}</td><td class="wrap"><b>${esc(p.name)}</b>${p.archived?' <span class="note">(보관)</span>':''}</td><td>${p.start} ~ ${p.end}</td><td>${statusPill(p.status)}</td><td>${esc(p.owner||'-')}</td><td class="wrap">${critTags(p,3)}</td><td class="wrap">${esc((p.purposeIds||[]).map(id=>(byId(S.purposes,id)||{}).name).filter(Boolean).join(', '))}</td><td class="wrap">${esc(((p.products||[])[0]||{}).name||'-')}</td><td class="wrap">${esc(p.benefit||'-')}</td><td class="r">${fmt(b.sales)}</td><td class="r">${fmt(b.total)}</td><td class="r">${b.roas!=null?b.roas.toFixed(1)+'배':'-'}</td><td>${pr?pr.done+'/'+pr.total:'-'}</td><td>${p.deadline||'-'}</td></tr>`;
  });
  h += `</tbody></table>`;
  $('#listwrap').innerHTML = h;
}
function buildReportText(){
  const rows = S.promotions.filter(isVisible).map(p=>Object.assign({},p,{_sp:spanOf(p)})).filter(p=>p._sp).sort((a,b)=>(a.start||'').localeCompare(b.start||''));
  const lines = [`라이프밀 ${YEAR}년 9~12월 채널별 프로모션 실행계획`, `작성일 ${todayISO()}`, ''];
  MONTHS.forEach(m=>{
    const mr = rows.filter(x=>WEEKS[x._sp.a].month===m); if(!mr.length) return;
    const bud = mr.reduce((s,x)=>s+budgetOf(x).total,0), sal = mr.reduce((s,x)=>s+budgetOf(x).sales,0);
    lines.push(`[${m}월] ${mr.length}건 / 총예산 ${won(bud)} / 목표 매출 ${won(sal)}`);
    for(let w=1;w<=5;w++){
      const wr = mr.filter(x=>WEEKS[x._sp.a].week===w); if(!wr.length) continue;
      const wk = WEEKS.find(x=>x.month===m&&x.week===w);
      lines.push(`  ${w}주차 (${wk.range})`);
      wr.forEach(p=>{ const ch=byId(S.channels,p.channelId); const b=budgetOf(p); const prod=((p.products||[])[0]||{}).name||'';
        lines.push(`  - [${ch?ch.name:'-'}] ${p.name} | ${p.start}~${p.end} | ${p.status}${p.owner?' | '+p.owner:''}`);
        const d=[]; if(prod) d.push('상품: '+prod); if(p.benefit) d.push('혜택: '+p.benefit); d.push('예산 '+won(b.total)); d.push('목표 매출 '+won(b.sales)); if(b.roas!=null) d.push('ROAS '+b.roas.toFixed(1)+'배');
        lines.push('    '+d.join(' / '));
      });
    }
    lines.push('');
  });
  return lines.join('\n');
}

/* ---------------- 모달 인프라 ---------------- */
let modalStack = [];
function openModal(html, opts){
  opts = opts||{};
  const ov = document.createElement('div'); ov.className='overlay';
  ov.innerHTML = `<div class="modal ${opts.narrow?'narrow':''}" role="dialog" aria-modal="true">${html}</div>`;
  ov.addEventListener('mousedown', e=>{ if(e.target===ov && !opts.sticky) closeModal(ov); });
  $('#modalRoot').appendChild(ov); modalStack.push(ov);
  $$('[data-close]', ov).forEach(b=>b.addEventListener('click', ()=>closeModal(ov)));
  return ov;
}
function closeModal(ov){ if(!ov) ov = modalStack[modalStack.length-1]; if(!ov) return; if(ov._onClose) ov._onClose(); ov.remove(); modalStack = modalStack.filter(x=>x!==ov); }
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && modalStack.length){ const ov=modalStack[modalStack.length-1]; if(!ov._noEsc) closeModal(ov); } });
let toastT; function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }

function newPromotion(pre){
  pre = pre||{};

  return { id:null, name:'', channelId: pre.channelId || (activeSorted(S.channels)[0]||{}).id || '', start: w?w.start:pre.start||`${YEAR}-09-01`, end: w?w.end:pre.end||`${YEAR}-09-07`,
    status:'아이디어', owner:'', deadline:'', theme:'', criteriaIds:[], purposeIds:[], bg:{why:'',whyChannel:'',link:'',behavior:''},
    target:'', products:[], gift:'', coupon:'', benefit:'',
    goal:{sales:'',qty:'',ad:'',discount:'',giftCost:'',prod:'',fee:'',logistics:'',etc:''},
    checklist: sorted(S.checklist).map(c=>({id:uid('ci'),tplId:c.id,name:c.name,done:false})),
    memo:'', links:[], files:[], contact:'', archived:false, createdAt:new Date().toISOString(), updatedAt:new Date().toISOString() };
}
function normalizePromotion(p){ // 예전 데이터·누락 필드 보정
  const n = newPromotion(); const out = Object.assign({}, n, clone(p));
  out.bg = Object.assign({}, n.bg, p.bg||{}); out.goal = Object.assign({}, n.goal, p.goal||{});

  return out;
}

  async function addCriterionInline(){
    const name = $('#critName',body).value.trim(); if(!name){ $('#critName',body).focus(); return; }

    else { const c={id:uid('cr'),name,desc:'',color:$('#critColor',body).value,order:S.criteria.length,active:true}; S.criteria.push(c); await S.store.put('criteria', c); id=c.id; }
    if(!d.criteriaIds.includes(id)) d.criteriaIds.push(id);
    $('#critName',body).value=''; $('#critAdd',body).hidden=true; $('#critColor',body).value = PALETTE[S.criteria.length%PALETTE.length];
    renderChips(); autosave(); toast(dup?'이미 있는 기준을 선택했습니다':'새 기준을 추가하고 선택했습니다');

  function productOptions(kind, cur){
    const list = activeSorted(S.products).filter(p=> kind==='event' ? p.type==='event' : (kind==='set' ? p.type==='set' : p.type!=='event'));
    const groups = {};
    list.forEach(p=>{ (groups[p.category||'기타'] = groups[p.category||'기타']||[]).push(p); });
    let h = `<option value="">상품 마스터에서 선택</option>`;
    if(kind==='set') h += `<option value="" ${!cur?'':''}>— 새 세트 직접 구성 —</option>`;
    Object.keys(groups).forEach(g=>{ h += `<optgroup label="${esc(g)}">` + groups[g].map(p=>`<option value="${p.id}" ${p.id===cur?'selected':''}>${esc(p.name)} · ${fmt(masterPrice(p))}원${p.type==='set'?' (세트)':''}</option>`).join('') + `</optgroup>`; });
    if(cur && !list.find(p=>p.id===cur) && cur!=='__manual'){ const p=productById(cur); h += `<option value="${cur}" selected>${esc(p?p.name+' (비활성)':'삭제된 상품')}</option>`; }
    h += `<option value="__manual" ${cur==='__manual'?'selected':''}>직접 입력</option>`;
    return h;
  }
  function applyMaster(it, p){ // 마스터 상품을 라인에 반영
    it.productId = p.id; it.name = p.name; it.price = String(masterPrice(p)); it.cost = String(num(p.cost));
    if(p.type==='set'){ it.kind='set'; it.components = clone(p.components||[]); it.comp = compText(it.components); }
    else { it.comp = p.spec||''; if(it.kind!=='event') it.kind='single'; }
    if(it.discType==='price' && (it.salePrice===''||it.salePrice==null)) it.salePrice = it.price;
  }
  function lineCalcHTML(it){ const s=lineSalePrice(it), pct=lineDiscPct(it); return `<span class="calc-sale num">${fmt(s)}원</span><span class="calc-disc num">${pct!=null?pct+'% 할인':'-'}</span>`; }
  function giftCostEstimate(){ const q=num(d.goal.qty)||saleLines(d).reduce((s,l)=>s+num(l.qty),0); return giftLines(d).reduce((s,g)=>s+num(g.cost)*num(g.qty||1),0)*q; }
  function renderProducts(){
    const L = $('#lineList',body), G = $('#giftList',body);

          <label>목표 판매수량<input type="number" min="0" data-lk="qty" value="${esc(it.qty)}"></label>
        </div>
      </div>`; }).join('') || '<div class="note" style="padding:6px 0">판매 상품을 추가하세요. 상품 마스터에서 고르면 단가와 구성이 자동으로 채워집니다.</div>';
    G.innerHTML = gifts.map(({it,i})=>`<div class="line gift" data-i="${i}">

        <div class="lrow2"><label>주문당 수량<input type="number" min="0" data-lk="qty" value="${esc(it.qty)}"></label><label>단위 원가<input type="number" min="0" data-lk="cost" value="${esc(it.cost)}"></label><label style="flex:2">지급 조건<input type="text" data-lk="cond" value="${esc(it.cond)}" placeholder="예: 2세트 이상 구매 시, 선착순 100명"></label><label>준비 수량<input type="number" min="0" data-lk="stock" value="${esc(it.stock)}"></label></div>
      </div>`).join('') || '<div class="note" style="padding:6px 0">연결된 이벤트 상품이 없습니다.</div>';
    // 바인딩

          if(k==='discType'){ it.discType=inp.value; if(it.discType==='price' && (it.salePrice===''||it.salePrice==null)) it.salePrice=lineSalePrice(Object.assign({},it,{discType:'pct'})); renderProducts(); recalc(); autosave(); return; }
